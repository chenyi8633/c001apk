# 酷安 Wear OS 0.5.1 / Galaxy Watch7 Kotlin 编译修复版自动编译工作流
# 使用：上传到 .github/workflows/wear-apk.yml 后提交到 main。
# 基于你最新上传的原版源码构建，保留 :core 网络层；手表端单独适配圆屏 UI。

name: Build Coolapk Wear OS v0.5.1 - Kotlin Fix - Galaxy Watch7
run-name: Wear OS 0.5.1 Kotlin 修复构建

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 37.0 platform and Build Tools 37.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          echo "Android SDK root: $SDK_ROOT"
          sdkmanager --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;37.0.0"
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/37.0.0"
          # Some AGP versions still look up compileSdk 37 as platforms/android-37.
          # Provide the compatibility alias while keeping the real 37.0 package intact.
          if [[ ! -e "$SDK_ROOT/platforms/android-37" ]]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          echo "Installed Android SDK packages:"
          sdkmanager --sdk_root="$SDK_ROOT" --list_installed | grep -E 'platforms;android-37|build-tools;37.0.0' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add Wear OS module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wear
          mkdir -p wear/src/main/kotlin/com/zailinn/c001apk/wear wear/src/main/res/drawable wear/src/main/res/xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          s = p.read_text()
          if '":wear"' not in s:
              original = 'include(":core", ":app")'
              if original not in s:
                  raise SystemExit("Cannot locate the original :core/:app module declaration in settings.gradle.kts")
              s = s.replace(original, 'include(":core", ":app", ":wear")', 1)
          p.write_text(s)
          PY
          cat > wear/build.gradle.kts <<'WEAR_EOF'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
          }
          
          android {
              namespace = "com.zailinn.c001apk.wear"
              compileSdk = 37
          
              defaultConfig {
                  applicationId = "com.zailinn.c001apk.wear"
                  minSdk = 30
                  targetSdk = 36
                  versionCode = 2026103102
                  versionName = "0.5.1"
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              buildTypes {
                  // Release build for direct sideloading. Keep R8 off here because the
                  // original Coolapk data model is intentionally dynamic JSON.
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          
              buildFeatures {
                  compose = true
              }
          
              packaging {
                  resources.excludes += setOf("META-INF/{AL2.0,LGPL2.1}", "META-INF/versions/9/OSGI-INF/MANIFEST.MF")
              }
          }
          
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  optIn.addAll(
                      "androidx.wear.compose.material3.ExperimentalWearMaterial3Api",
                      "androidx.wear.compose.foundation.ExperimentalWearFoundationApi",
                      "androidx.compose.foundation.ExperimentalFoundationApi",
                      "androidx.compose.foundation.layout.ExperimentalLayoutApi",
                  )
              }
          }
          
          dependencies {
              implementation(project(":core"))
              implementation(libs.kotlinx.coroutines.android)
          
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.foundation)
              implementation("androidx.compose.animation:animation")
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.core.ktx)
              implementation(libs.coil.compose)
              implementation(libs.coil.network.okhttp)
          
              implementation("androidx.wear.compose:compose-material3:1.5.0")
              implementation("androidx.wear.compose:compose-foundation:1.5.0")
              implementation("androidx.wear.compose:compose-navigation:1.5.0")
              implementation("androidx.navigation:navigation-runtime:2.9.0")
          }
          WEAR_EOF
          cat > wear/proguard-rules.pro <<'WEAR_EOF'
          # kotlinx.serialization: keep generated serializers of app and core models.
          -keepattributes *Annotation*, InnerClasses
          -keepclassmembers class com.zailinn.c001apk.** {
              *** Companion;
          }
          -keepclasseswithmembers class com.zailinn.c001apk.** {
              kotlinx.serialization.KSerializer serializer(...);
          }
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          WEAR_EOF
          cat > wear/src/main/AndroidManifest.xml <<'WEAR_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-feature android:name="android.hardware.type.watch" />
              <uses-permission android:name="android.permission.INTERNET" />
          
              <application
                  android:name=".WearApplication"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="酷安"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">
          
                  <meta-data
                      android:name="com.google.android.wearable.standalone"
                      android:value="true" />
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:taskAffinity=""
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          WEAR_EOF
          cat > wear/src/main/kotlin/com/zailinn/c001apk/wear/AccountScreens.kt <<'WEAR_EOF'
          package com.zailinn.c001apk.wear
          
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.padding
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.size
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.wear.compose.foundation.lazy.ScalingLazyColumn
          import androidx.wear.compose.foundation.lazy.rememberScalingLazyListState
          import androidx.wear.compose.material3.Button
          import androidx.wear.compose.material3.FilledTonalButton
          import androidx.wear.compose.material3.EdgeButton
          import androidx.wear.compose.material3.ListHeader
          import androidx.wear.compose.material3.MaterialTheme
          import androidx.wear.compose.material3.ScreenScaffold
          import androidx.wear.compose.material3.Text
          import coil3.compose.AsyncImage
          import com.zailinn.c001apk.core.model.Datum
          import com.zailinn.c001apk.core.model.LoadResult
          import kotlinx.coroutines.launch
          import java.net.URLDecoder
          
          @Composable
          fun MeScreen(container: WearContainer, onLogin: () -> Unit, onProfile: (String) -> Unit, onAbout: () -> Unit) {
              val account = container.account
              var info by remember(account?.uid) { mutableStateOf<Datum?>(null) }
              LaunchedEffect(account?.uid) {
                  val uid = account?.uid ?: return@LaunchedEffect
                  val result = container.repository.userSpace(uid)
                  if (result is LoadResult.Success) info = result.value
              }
              val listState = rememberScalingLazyListState()
              val name = account?.let { runCatching { URLDecoder.decode(it.username, "UTF-8") }.getOrDefault(it.username) }
          
              ScreenScaffold(scrollState = listState) { padding ->
                  ScalingLazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      state = listState,
                      contentPadding = padding,
                      horizontalAlignment = Alignment.CenterHorizontally,
                  ) {
                      item { ListHeader { Text("我的") } }
                      if (account == null) {
                          item { LetterBadge("游", 48.dp) }
                          item {
                              Text(
                                  "游客模式",
                                  style = MaterialTheme.typography.titleSmall,
                                  textAlign = TextAlign.Center,
                              )
                          }
                          item {
                              Text(
                                  "可以浏览、搜索和看图。登录后可以点赞、关注。",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  textAlign = TextAlign.Center,
                              )
                          }
                          item {
                              Button(
                                  onClick = onLogin,
                                  modifier = Modifier.fillMaxWidth(),
                                  label = { Text("Cookie 登录") },
                              )
                          }
                      } else {
                          item { Avatar(info?.userAvatar, 56.dp) }
                          item {
                              Text(
                                  name.orEmpty(),
                                  style = MaterialTheme.typography.titleMedium,
                                  color = Brand,
                                  textAlign = TextAlign.Center,
                                  maxLines = 2,
                              )
                          }
                          item {
                              Text(
                                  "UID ${account.uid}",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                          item {
                              Button(
                                  onClick = { onProfile(account.uid) },
                                  modifier = Modifier.fillMaxWidth(),
                                  label = { Text("我的主页") },
                              )
                          }
                          item {
                              FilledTonalButton(
                                  onClick = { container.logout() },
                                  modifier = Modifier.fillMaxWidth(),
                                  label = { Text("退出登录") },
                              )
                          }
                      }
                      item {
                          FilledTonalButton(
                              onClick = onAbout,
                              modifier = Modifier.fillMaxWidth(),
                              label = { Text("关于") },
                          )
                      }
                  }
              }
          }
          
          @Composable
          fun LoginScreen(container: WearContainer, onDone: () -> Unit) {
              var text by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var message by remember { mutableStateOf<String?>(null) }
              val scope = rememberCoroutineScope()
              val listState = rememberScalingLazyListState()
          
              fun submit() {
                  if (busy || text.isBlank()) return
                  busy = true
                  message = null
                  scope.launch {
                      val error = container.loginWithCookie(text)
                      busy = false
                      if (error == null) onDone() else message = error
                  }
              }
          
              ScreenScaffold(
                  scrollState = listState,
                  edgeButton = {
                      EdgeButton(onClick = ::submit, enabled = text.isNotBlank() && !busy) {
                          Text(if (busy) "验证中…" else "登录")
                      }
                  },
              ) { padding ->
                  ScalingLazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      state = listState,
                      contentPadding = padding,
                  ) {
                      item { ListHeader { Text("Cookie 登录") } }
                      item {
                          Text(
                              "粘贴含 uid、username、token 的 Cookie。Cookie 等同于账号密码，请勿使用他人提供的。",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              textAlign = TextAlign.Center,
                          )
                      }
                      item {
                          WatchTextField(
                              value = text,
                              onValueChange = { text = it },
                              hint = "点这里输入或粘贴",
                              singleLine = false,
                          )
                      }
                      message?.let { error ->
                          item {
                              Text(
                                  error,
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.error,
                                  textAlign = TextAlign.Center,
                              )
                          }
                      }
                  }
              }
          }
          
          /** Full-screen picture. Tap the image to move to the next one; the bottom action saves it. */
          @Composable
          fun ImageViewerScreen(urls: List<String>, startIndex: Int, container: WearContainer) {
              var index by remember { mutableIntStateOf(startIndex.coerceIn(0, (urls.size - 1).coerceAtLeast(0))) }
              var saving by remember { mutableStateOf(false) }
              var message by remember { mutableStateOf<String?>(null) }
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val placeholder = softPainter()
              androidx.compose.foundation.layout.Box(
                  modifier = Modifier.fillMaxSize(),
                  contentAlignment = Alignment.Center,
              ) {
                  AsyncImage(
                      model = urls.getOrNull(index),
                      contentDescription = null,
                      modifier = Modifier.fillMaxSize().clickable {
                          if (urls.isNotEmpty()) index = (index + 1) % urls.size
                          message = null
                      },
                      contentScale = ContentScale.Fit,
                      placeholder = placeholder,
                  )
                  Column(
                      modifier = Modifier.align(Alignment.BottomCenter)
                          .background(Color.Black.copy(alpha = .62f), androidx.compose.foundation.shape.RoundedCornerShape(20.dp))
                          .padding(horizontal = 10.dp, vertical = 6.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                  ) {
                      if (message != null) Text(message.orEmpty(), style = MaterialTheme.typography.labelSmall, color = Color.White, textAlign = TextAlign.Center)
                      if (urls.size > 1) Text("${index + 1}/${urls.size} · 点击图片下一张", style = MaterialTheme.typography.labelSmall, color = Color.White)
                      FilledTonalButton(
                          onClick = {
                              val url = urls.getOrNull(index) ?: return@FilledTonalButton
                              if (saving) return@FilledTonalButton
                              saving = true
                              message = null
                              scope.launch {
                                  val result = container.saveImage(context, url)
                                  saving = false
                                  message = if (result.isSuccess) "已保存到相册" else "保存失败，请检查网络"
                              }
                          },
                          enabled = !saving && urls.isNotEmpty(),
                      ) { Text(if (saving) "保存中…" else "下载图片") }
                  }
              }
          }
          WEAR_EOF
          cat > wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt <<'WEAR_EOF'
          package com.zailinn.c001apk.wear
          
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.width
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.wear.compose.foundation.lazy.ScalingLazyColumn
          import androidx.wear.compose.foundation.lazy.items
          import androidx.wear.compose.foundation.lazy.rememberScalingLazyListState
          import androidx.wear.compose.material3.FilledTonalButton
          import androidx.wear.compose.material3.ListHeader
          import androidx.wear.compose.material3.MaterialTheme
          import androidx.wear.compose.material3.ScreenScaffold
          import androidx.wear.compose.material3.Text
          import com.zailinn.c001apk.core.model.Datum
          import com.zailinn.c001apk.core.model.LoadResult
          import com.zailinn.c001apk.core.net.Page
          import kotlinx.coroutines.launch
          
          private data class Channel(val title: String)
          private val channels = listOf("搜索", "推荐", "热门", "话题", "数码", "酷图")
          
          @Composable
          fun ChannelHubScreen(
              container: WearContainer,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
              onOpenCategory: (Datum) -> Unit,
              onMe: () -> Unit,
          ) {
              val pager = rememberPagerState(initialPage = 1) { channels.size }
              val scope = rememberCoroutineScope()
              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 4.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      FilledTonalButton(onClick = onMe, modifier = Modifier.weight(1f)) { Text("我的", maxLines = 1) }
                      Spacer(Modifier.width(6.dp))
                      Text(channels[pager.currentPage], style = MaterialTheme.typography.titleSmall, modifier = Modifier.weight(1f), maxLines = 1)
                  }
                  Row(
                      Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(horizontal = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(4.dp),
                  ) {
                      channels.forEachIndexed { index, title ->
                          FilledTonalButton(onClick = { scope.launch { pager.animateScrollToPage(index) } }) {
                              Text(title, maxLines = 1)
                          }
                      }
                  }
                  HorizontalPager(pager, Modifier.fillMaxSize()) { page ->
                      when (page) {
                          0 -> SearchChannel(container, onOpenFeed, onOpenUser, onOpenTarget)
                          1 -> FeedChannel(container, "推荐", null, null, onOpenFeed, onOpenUser, onOpenTarget)
                          2 -> FeedChannel(container, "热门", "/page?url=V9_HOME_TAB_RANKING", "热榜", onOpenFeed, onOpenUser, onOpenTarget)
                          3 -> CategoryIndexChannel(container, topic = true, onOpenCategory = onOpenCategory)
                          4 -> CategoryIndexChannel(container, topic = false, onOpenCategory = onOpenCategory)
                          else -> FeedChannel(container, "酷图", "/page?url=V11_FIND_COOLPIC", "酷图", onOpenFeed, onOpenUser, onOpenTarget)
                      }
                  }
              }
          }
          
          @Composable
          private fun FeedChannel(
              container: WearContainer,
              title: String,
              url: String?,
              dataTitle: String?,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
          ) {
              val feed = remember(title, container.accountVersion) {
                  PagedFeed { page ->
                      if (url == null) container.repository.homeFeed(page, 1, container.installTime)
                      else container.repository.dataList(url, dataTitle ?: title, page, hideFolded = true)
                  }
              }
              val state = rememberScalingLazyListState()
              val cards = remember(feed.items) { feed.items.filter { it.entityType == "feed" } }
              LaunchedEffect(feed.loadedPages) { if (feed.loadedPages == 0) feed.loadNext() }
              PrefetchNearEnd(feed, state, cards.size)
              ScreenScaffold(scrollState = state) { padding ->
                  ScalingLazyColumn(Modifier.fillMaxSize(), state = state, contentPadding = padding) {
                      item { ListHeader { Text(title) } }
                      items(cards, key = { it.entityId ?: it.id ?: it.hashCode().toString() }) {
                          FeedCard(it, onClick = { onOpenFeed(it) }, onUser = onOpenUser, onTarget = onOpenTarget)
                      }
                      item { ListFooter(feed, emptyText = if (cards.isEmpty()) "暂无内容" else "没有更多了") }
                  }
              }
          }
          
          @Composable
          private fun CategoryIndexChannel(container: WearContainer, topic: Boolean, onOpenCategory: (Datum) -> Unit) {
              var state by remember(topic) { mutableStateOf<LoadResult<List<Datum>>>(LoadResult.Loading) }
              LaunchedEffect(topic) {
                  state = if (topic) {
                      when (val result = container.repository.dataListFromUrl("/v6/page/dataList", listOf("url" to "V11_VERTICAL_TOPIC", "title" to "话题", "page" to "1"))) {
                          is LoadResult.Success -> LoadResult.Success(result.value.firstOrNull()?.entities.orEmpty())
                          is LoadResult.Error -> result
                          LoadResult.Empty -> LoadResult.Empty
                          LoadResult.Loading -> LoadResult.Loading
                      }
                  } else {
                      container.repository.dataListFromUrl("/v6/product/categoryList")
                  }
              }
              val list = (state as? LoadResult.Success)?.value.orEmpty()
              val listState = rememberScalingLazyListState()
              ScreenScaffold(scrollState = listState) { padding ->
                  ScalingLazyColumn(Modifier.fillMaxSize(), state = listState, contentPadding = padding) {
                      item { ListHeader { Text(if (topic) "话题" else "数码") } }
                      if (state is LoadResult.Loading) item { PulsingText("加载中…") }
                      if (state is LoadResult.Error) item { Text((state as LoadResult.Error).message, style = MaterialTheme.typography.bodySmall) }
                      items(list, key = { it.entityId ?: it.id ?: it.hashCode().toString() }) { item ->
                          FilledTonalButton(
                              onClick = { onOpenCategory(item) },
                              modifier = Modifier.fillMaxWidth(),
                              label = { Text(item.title.orEmpty(), maxLines = 1, overflow = TextOverflow.Ellipsis) },
                              secondaryLabel = { Text(item.string("hot_num_txt") ?: item.string("feed_num_txt") ?: "进入板块", maxLines = 1) },
                          )
                      }
                  }
              }
          }
          
          @Composable
          private fun SearchChannel(
              container: WearContainer,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
          ) {
              var text by remember { mutableStateOf("") }
              var keyword by remember { mutableStateOf<String?>(null) }
              val submit = { val value = text.trim(); if (value.isNotEmpty()) { container.addHistory(value); keyword = value } }
              val listState = rememberScalingLazyListState()
              ScreenScaffold(scrollState = listState) { padding ->
                  ScalingLazyColumn(Modifier.fillMaxSize(), state = listState, contentPadding = padding) {
                      item { ListHeader { Text("搜索") } }
                      item {
                          WatchTextField(value = text, onValueChange = { text = it }, hint = "动态、数码、话题、用户", imeAction = ImeAction.Search, onImeAction = submit)
                      }
                      item { FilledTonalButton(onClick = submit, enabled = text.isNotBlank(), modifier = Modifier.fillMaxWidth()) { Text("搜索") } }
                      if (keyword == null && container.history.isNotEmpty()) {
                          item { ListHeader { Text("最近搜索") } }
                          items(container.history) { word -> FilledTonalButton(onClick = { text = word; keyword = word }, modifier = Modifier.fillMaxWidth()) { Text(word, maxLines = 1) } }
                      }
                      keyword?.let { value ->
                          item { SearchResultsSection(container, value, onOpenFeed, onOpenUser, onOpenTarget) }
                      }
                  }
              }
          }
          
          @Composable
          private fun SearchResultsSection(
              container: WearContainer,
              keyword: String,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
          ) {
              Column(Modifier.fillMaxWidth()) {
                  Text("搜索：$keyword", style = MaterialTheme.typography.titleSmall)
                  SearchTypeButton(container, keyword, "动态", "feed", onOpenFeed, onOpenUser, onOpenTarget)
                  SearchTypeButton(container, keyword, "数码", "product", onOpenFeed, onOpenUser, onOpenTarget)
                  SearchTypeButton(container, keyword, "话题", "feedTopic", onOpenFeed, onOpenUser, onOpenTarget)
                  SearchTypeButton(container, keyword, "用户", "user", onOpenFeed, onOpenUser, onOpenTarget)
              }
          }
          
          @Composable
          private fun SearchTypeButton(
              container: WearContainer,
              keyword: String,
              label: String,
              type: String,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
          ) {
              var opened by remember(keyword, type) { mutableStateOf(false) }
              var results by remember(keyword, type) { mutableStateOf<List<Datum>>(emptyList()) }
              var loading by remember(keyword, type) { mutableStateOf(false) }
              Column(Modifier.fillMaxWidth()) {
                  FilledTonalButton(onClick = {
                      if (opened) return@FilledTonalButton
                      opened = true
                      loading = true
                      // Launching from composition is avoided; the visible result section is loaded below.
                  }, modifier = Modifier.fillMaxWidth()) { Text("$label 结果") }
                  if (opened && !loading) {
                      results.forEach { item -> SearchResultCard(item, onOpenFeed, onOpenUser, onOpenTarget) }
                  }
                  if (opened && loading) {
                      LaunchedEffect(keyword, type) {
                          val result = container.repository.search(type, "all", "default", keyword, 0, null, null, Page())
                          results = (result as? LoadResult.Success)?.value.orEmpty().take(8)
                          loading = false
                      }
                      PulsingText("加载中…")
                  }
              }
          }
          
          @Composable
          private fun SearchResultCard(item: Datum, onOpenFeed: (Datum) -> Unit, onOpenUser: (String) -> Unit, onOpenTarget: (Datum) -> Unit) {
              val click = when (item.entityType) {
                  "feed" -> ({ onOpenFeed(item) })
                  "user" -> ({ item.uid?.let(onOpenUser); Unit })
                  "product", "topic" -> ({ onOpenTarget(item) })
                  else -> ({})
              }
              FilledTonalButton(onClick = click, modifier = Modifier.fillMaxWidth()) {
                  Text(item.title ?: item.displayName.ifBlank { item.messageTitle ?: plainText(item.message.orEmpty()) }, maxLines = 2, overflow = TextOverflow.Ellipsis)
              }
          }
          
          @Composable
          fun CategoryFeedScreen(
              container: WearContainer,
              category: Datum,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
          ) {
              val title = category.title.orEmpty().ifBlank { "板块" }
              val url = category.url.orEmpty()
              val feed = remember(url, container.accountVersion) { PagedFeed { page -> container.repository.dataList(url, title, page, hideFolded = true) } }
              val state = rememberScalingLazyListState()
              val cards = remember(feed.items) { feed.items.filter { it.entityType == "feed" } }
              LaunchedEffect(feed.loadedPages) { if (feed.loadedPages == 0) feed.loadNext() }
              PrefetchNearEnd(feed, state, cards.size)
              ScreenScaffold(scrollState = state) { padding ->
                  ScalingLazyColumn(Modifier.fillMaxSize(), state = state, contentPadding = padding) {
                      item { ListHeader { Text(title) } }
                      items(cards, key = { it.entityId ?: it.id ?: it.hashCode().toString() }) { post ->
                          FeedCard(post, onClick = { onOpenFeed(post) }, onUser = onOpenUser, onTarget = onOpenTarget)
                      }
                      item { ListFooter(feed, emptyText = "没有更多内容") }
                  }
              }
          }
          
          @Composable
          private fun PrefetchNearEnd(feed: PagedFeed, state: androidx.wear.compose.foundation.lazy.ScalingLazyListState, count: Int) {
              LaunchedEffect(state, count) {
                  androidx.compose.runtime.snapshotFlow { state.centerItemIndex }.collect { index ->
                      if (count > 0 && index >= count - 2) feed.loadNext()
                  }
              }
          }
