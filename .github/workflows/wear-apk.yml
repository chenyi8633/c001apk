          @Composable
          private fun ToggleButton(container: WearContainer, key: String, title: String, subtitle: String, default: Boolean) {
              val checked = container.getBool(key, default)
              MenuButton("${if (checked) "✓" else "○"} $title", "$subtitle · ${if (checked) "开启" else "关闭"}") {
                  container.setBool(key, !checked)
              }
