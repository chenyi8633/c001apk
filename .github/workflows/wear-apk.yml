      - name: Verify extracted Wear OS build scripts
        shell: bash
        run: |
          set -euo pipefail
          script_dir=".github/scripts/wear-apk-0.6.23"
          test -d "$script_dir"
          for number in $(seq -w 1 22); do
            script="$script_dir/step-${number}.sh"
            test -f "$script"
            bash -n "$script"
          done
          actual="$(find "$script_dir" -maxdepth 1 -type f -name 'step-*.sh' | wc -l)"
          if [[ "$actual" -ne 22 ]]; then
            echo "Expected 22 Wear build scripts, found $actual" >&2
            exit 1
          fi

