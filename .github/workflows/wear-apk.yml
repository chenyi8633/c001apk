          /** Shared Wear state: original Coolapk network/core layer, account, local lists and watch preferences. */
          class WearContainer(context: Context) {
              private val appContext = context.applicationContext
              private val prefs = context.getSharedPreferences("wear", Context.MODE_PRIVATE)
              private val protocol: ProtocolParams = loadProtocol()
          
              val installTime: String = prefs.getString("installTime", null)
                  ?: System.currentTimeMillis().toString().also { prefs.edit().putString("installTime", it).apply() }
          
              val session = SessionState()
              private val baseHttp = OkHttpClient()
          
              /** Images only get the client user agent, never API credentials. */
              val imageHttp: OkHttpClient = baseHttp.newBuilder()
                  .addInterceptor { chain ->
                      chain.proceed(chain.request().newBuilder().header("User-Agent", protocol.userAgent).build())
                  }
                  .build()
          
              val client = CoolapkClient(session, CoolapkHeaders(session, { protocol }), baseHttp)
              val repository = CoolapkRepository(client)
          
              var account by mutableStateOf<AccountCredentials?>(null)
                  private set
              var accountVersion by mutableIntStateOf(0)
                  private set
              var settingsRevision by mutableIntStateOf(0)
                  private set
              var homeRefreshRevision by mutableIntStateOf(0)
                  private set
              var history by mutableStateOf(readSearchHistory())
                  private set
              var localFavorites by mutableStateOf(readDatums("local_favorites"))
                  private set
              var browseHistory by mutableStateOf(readDatums("browse_history"))
                  private set
          
              val deviceSummary: String
                  get() = "${protocol.manufacturer} ${protocol.model} · Android ${protocol.androidVersion} · API ${protocol.sdkInt}"
          
              init {
                  WearTextPreferences.showCoolapkEmoji = prefs.getBoolean("show_emoji", true)
                  val uid = prefs.getString("acc_uid", null)
                  val name = prefs.getString("acc_name", null)
                  val token = prefs.getString("acc_token", null)
                  if (uid != null && name != null && token != null) {
                      val saved = AccountCredentials(uid, name, token)
                      account = saved
                      session.activate(saved, notify = false)
                  }
              }
          
              suspend fun loginWithCookie(text: String): String? {
                  val pasted = AccountCredentials.parseCookie(text) ?: return "Cookie 缺少有效的 uid、username 或 token"
                  try {
                      val data = readApiObject(repository.checkLoginInfo(pasted))["data"] as? JsonObject
                          ?: return "Cookie 无效或已过期"
                      val uid = (data["uid"] as? JsonPrimitive)?.content
                      if (uid != pasted.uid) return "Cookie 无效或已过期"
                      val token = (data["token"] as? JsonPrimitive)?.content?.takeIf { it.isNotEmpty() } ?: pasted.token
                      val saved = pasted.copy(token = token)
                      prefs.edit()
                          .putString("acc_uid", saved.uid)
                          .putString("acc_name", saved.username)
                          .putString("acc_token", saved.token)
                          .apply()
                      session.activate(saved, notify = true)
                      account = saved
                      accountVersion++
                      return null
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      return ApiFailure.from(e).message
                  }
              }
          
              fun logout() {
                  prefs.edit().remove("acc_uid").remove("acc_name").remove("acc_token").apply()
                  session.activate(null, notify = true)
                  account = null
                  accountVersion++
              }
          
              fun addHistory(keyword: String) {
                  val clean = keyword.trim()
                  if (clean.isEmpty()) return
                  history = (listOf(clean) + history.filter { it != clean }).take(12)
                  prefs.edit().putString("history", history.joinToString("\n")).apply()
              }
          
              fun clearHistory() {
                  history = emptyList()
                  prefs.edit().remove("history").apply()
              }
          
              suspend fun saveImage(context: Context, url: String): Result<Unit> = saveWatchImage(context, imageHttp, url)
          
              fun requestHomeRefresh() { homeRefreshRevision++ }
          
              fun getBool(key: String, default: Boolean = false): Boolean = prefs.getBoolean(key, default)
              fun setBool(key: String, value: Boolean) {
                  prefs.edit().putBoolean(key, value).apply()
                  if (key == "show_emoji") WearTextPreferences.showCoolapkEmoji = value
                  settingsRevision++
              }
              fun getInt(key: String, default: Int = 0): Int = prefs.getInt(key, default)
              fun setInt(key: String, value: Int) { prefs.edit().putInt(key, value).apply(); settingsRevision++ }
              fun getText(key: String, default: String = ""): String = prefs.getString(key, default).orEmpty()
              fun setText(key: String, value: String) { prefs.edit().putString(key, value).apply(); settingsRevision++ }
          
              fun isLocallyFavorite(feedId: String?): Boolean = feedId != null && localFavorites.any { (it.id ?: it.entityId) == feedId }
          
              fun toggleLocalFavorite(feed: Datum): Boolean {
                  val id = feed.id ?: feed.entityId ?: return false
                  localFavorites = if (isLocallyFavorite(id)) {
                      localFavorites.filterNot { (it.id ?: it.entityId) == id }
                  } else {
                      (listOf(feed) + localFavorites).take(100)
                  }
                  writeDatums("local_favorites", localFavorites)
                  return isLocallyFavorite(id)
              }
          
              fun clearLocalFavorites() {
                  localFavorites = emptyList()
                  writeDatums("local_favorites", localFavorites)
              }
          
              fun recordFeedVisit(feed: Datum) {
                  if (!getBool("record_browse_history", true)) return
                  val id = feed.id ?: feed.entityId ?: return
                  browseHistory = (listOf(feed) + browseHistory.filterNot { (it.id ?: it.entityId) == id }).take(80)
                  writeDatums("browse_history", browseHistory)
              }
          
              fun clearBrowseHistory() {
                  browseHistory = emptyList()
                  writeDatums("browse_history", browseHistory)
              }
          
              /** Local keyword / UID filters. They never alter or delete server-side content. */
              fun visibleFeeds(items: List<Datum>): List<Datum> {
                  val blockedWords = getText("blocked_words").split(',', '\n', '，').map { it.trim() }.filter { it.isNotEmpty() }
                  val blockedUids = getText("blocked_uids").split(',', '\n', '，').map { it.trim() }.filter { it.isNotEmpty() }.toSet()
                  if (blockedWords.isEmpty() && blockedUids.isEmpty()) return items.filter { it.entityType == "feed" }
                  return items.filter { item ->
                      if (item.entityType != "feed") return@filter false
                      val uid = item.userInfo?.uid ?: item.uid.orEmpty()
                      val body = (item.messageTitle.orEmpty() + " " + item.text("message")).lowercase()
                      uid !in blockedUids && blockedWords.none { body.contains(it.lowercase()) }
                  }
              }
          
              fun exportLocalBackup(): String = buildString {
                  append("酷安 Wear OS 本地备份索引\n")
                  append("导出时间：").append(System.currentTimeMillis()).append('\n')
                  append("\n[本地收藏]\n")
                  localFavorites.forEach { append(it.id ?: it.entityId ?: "").append('\t').append(it.messageTitle ?: it.title.orEmpty()).append('\n') }
                  append("\n[浏览历史]\n")
                  browseHistory.forEach { append(it.id ?: it.entityId ?: "").append('\t').append(it.messageTitle ?: it.title.orEmpty()).append('\n') }
                  append("\n提示：这是手表本地索引备份，不包含服务器图片文件或登录 Cookie。")
              }
          
              private fun readSearchHistory(): List<String> =
                  prefs.getString("history", null)?.split('\n')?.filter { it.isNotBlank() }.orEmpty()
          
              private fun readDatums(key: String): List<Datum> = runCatching {
                  val parsed = Json.parseToJsonElement(prefs.getString(key, "[]").orEmpty()) as? JsonArray ?: return@runCatching emptyList()
                  parsed.mapNotNull { element -> (element as? JsonObject)?.let(::Datum) }
              }.getOrDefault(emptyList())
          
              private fun writeDatums(key: String, rows: List<Datum>) {
                  prefs.edit().putString(key, JsonArray(rows.map { it.json }).toString()).apply()
              }
          
              private fun loadProtocol(): ProtocolParams {
                  val device = prefs.getString("xAppDevice", null)
                  if (device != null) {
                      return ProtocolParams(
                          manufacturer = prefs.getString("manufacturer", "").orEmpty(),
                          brand = prefs.getString("brand", "").orEmpty(),
                          model = prefs.getString("model", "").orEmpty(),
                          buildNumber = prefs.getString("buildNumber", "").orEmpty(),
                          sdkInt = prefs.getString("sdkInt", "").orEmpty(),
                          androidVersion = prefs.getString("androidVersion", "").orEmpty(),
                          userAgent = prefs.getString("userAgent", "").orEmpty(),
                          xAppDevice = device,
                      )
                  }
                  val fresh = ProtocolParams.generate()
                  prefs.edit()
                      .putString("manufacturer", fresh.manufacturer)
                      .putString("brand", fresh.brand)
                      .putString("model", fresh.model)
                      .putString("buildNumber", fresh.buildNumber)
                      .putString("sdkInt", fresh.sdkInt)
                      .putString("androidVersion", fresh.androidVersion)
                      .putString("userAgent", fresh.userAgent)
                      .putString("xAppDevice", fresh.xAppDevice)
                      .apply()
                  return fresh
              }
          }
