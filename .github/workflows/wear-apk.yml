          grep -q '":wear"' settings.gradle.kts
          grep -q 'versionCode = 2026103102' wear/build.gradle.kts
          grep -q 'versionName = \"0.5.1\"' wear/build.gradle.kts
          test -f wear/src/main/AndroidManifest.xml
          test -f wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          test -f wear/src/main/kotlin/com/zailinn/c001apk/wear/ImageSaver.kt

      - name: Check requested Wear features and source API compatibility
        shell: bash
        run: |
          set -euo pipefail
          REPO=core/src/main/kotlin/com/zailinn/c001apk/core/net/CoolapkRepository.kt
          test -f "$REPO"
          for api in homeFeed dataList dataListFromUrl search feedDetail feedRepliesWithoutPrompt subReplies userSpace userFeed topicDetail postAction; do
            grep -Eq "suspend fun ${api}\b" "$REPO" || { echo "Missing core API: ${api}"; exit 1; }
          done
          grep -q '"热门"' wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          grep -q '"话题"' wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          grep -q '"数码"' wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          grep -q '"酷图"' wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          grep -q '"搜索"' wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          grep -q 'HorizontalPager' wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          if grep -q 'androidx.compose.foundation.layout.fillMaxSize()' wear/src/main/kotlin/com/zailinn/c001apk/wear/AccountScreens.kt; then
            echo 'Invalid fully-qualified extension call to fillMaxSize() remains in AccountScreens.kt'; exit 1
          fi
          grep -q 'Modifier.fillMaxSize()' wear/src/main/kotlin/com/zailinn/c001apk/wear/AccountScreens.kt
          grep -q 'item.uid?.let(onOpenUser); Unit' wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt
          grep -q 'replyRows' wear/src/main/kotlin/com/zailinn/c001apk/wear/Components.kt
          grep -q 'subReplies(origin.id.orEmpty(), page)' wear/src/main/kotlin/com/zailinn/c001apk/wear/DetailScreens.kt
          grep -q 'MediaStore.Images.Media' wear/src/main/kotlin/com/zailinn/c001apk/wear/ImageSaver.kt
          grep -q 'saveImage(context, url)' wear/src/main/kotlin/com/zailinn/c001apk/wear/AccountScreens.kt
          grep -q 'userSpace(uid)' wear/src/main/kotlin/com/zailinn/c001apk/wear/DetailScreens.kt
          grep -q 'topicDetail(target.tag, target.id)' wear/src/main/kotlin/com/zailinn/c001apk/wear/TargetScreen.kt
          if grep -RIn 'android.webkit.WebView' wear/src/main/kotlin; then
            echo 'Wear module must not require WebView.'; exit 1
          fi
          echo 'Requested feature/API checks passed.'

