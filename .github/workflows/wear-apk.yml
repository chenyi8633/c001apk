              LaunchedEffect(activeUrl, feed.loadedPages) {
                  if (baseUrl.isNotBlank() && feed.items.isEmpty() && feed.error == null && !feed.ended) {
                      feed.loadNext()
                  }
              }
              val visibleItems = remember(feed.items) {
                  feed.items.filterNot {
                      it.entityTemplate == "configCard" || it.entityTemplate == "sortSelectCard" ||
                          (it.entityTemplate == "imageScaleCard" && it.picArr.isEmpty())
                  }
              }
              val state = rememberScalingLazyListState()
