           * fall back to a browser installed on the watch itself.
           */
          fun openCoolapkPost(
              context: Context,
              feedId: String,
              onStatus: (String) -> Unit = {},
          ): Boolean {
              val safeId = feedId.filter { it.isDigit() }
              if (safeId.isBlank()) return false
              val url = "https://www.coolapk.com/feed/$safeId"
              val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).addCategory(Intent.CATEGORY_BROWSABLE)
              return try {
                  val executor = ContextCompat.getMainExecutor(context)
                  val future = RemoteActivityHelper(context, executor).startRemoteActivity(intent, null)
                  future.addListener({
                      try {
                          future.get()
                          onStatus("已发送到配对手机，请在手机酷安或浏览器中查看完整评论并完成验证。")
                      } catch (_: Exception) {
                          val openedOnWatch = openExternalUrl(context, url)
                          onStatus(if (openedOnWatch) "手机未能接收，已尝试在手表浏览器打开。" else "未能打开浏览器；请在配对手机上打开酷安原帖。")
                      }
                  }, executor)
                  true
              } catch (_: Exception) {
                  openExternalUrl(context, url)
              }
          }
          
          /** Explicit local-browser fallback, in case users prefer opening on the watch. */
          fun openCoolapkPostOnWatch(context: Context, feedId: String): Boolean {
              val safeId = feedId.filter { it.isDigit() }
              if (safeId.isBlank()) return false
              return openExternalUrl(context, "https://www.coolapk.com/feed/$safeId")
          }
          
          fun openExternalUrl(context: Context, url: String): Boolean = try {
              val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                  .addCategory(Intent.CATEGORY_BROWSABLE)
                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              context.startActivity(intent)
              true
          } catch (_: Exception) {
              false
          }
          
          fun copyCoolapkPostUrl(context: Context, feedId: String) {
              val safeId = feedId.filter { it.isDigit() }
              if (safeId.isNotBlank()) copyText(context, "Coolapk post URL", "https://www.coolapk.com/feed/$safeId")
          }
          
          private fun copyText(context: Context, label: String, value: String) {
              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              clipboard.setPrimaryClip(ClipData.newPlainText(label, value))
          }
          
          @Suppress("DEPRECATION")
          private fun performWearHaptic(context: Context) {
              val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
              if (!vibrator.hasVibrator()) return
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                  vibrator.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_TICK))
              } else {
                  vibrator.vibrate(12)
              }
          }
          
          @Composable
          fun MeScreen(
              container: WearContainer,
              onLogin: () -> Unit,
              onProfile: (String) -> Unit,
              onAbout: () -> Unit,
              onSettings: () -> Unit,
              onOpenList: (String, String?) -> Unit,
              onOpenNotification: (String) -> Unit,
          ) {
              val account = container.account
              var profile by remember(account?.uid) { mutableStateOf<Datum?>(null) }
              var profileError by remember(account?.uid) { mutableStateOf<String?>(null) }
              val listState = rememberScalingLazyListState()
              val name = account?.let { runCatching { URLDecoder.decode(it.username, "UTF-8") }.getOrDefault(it.username) }
              LaunchedEffect(account?.uid, container.accountVersion) {
                  profile = null
                  profileError = null
                  val uid = account?.uid ?: return@LaunchedEffect
                  try {
                      val response = readApiObject(container.repository.profile(uid))
                      profile = (response["data"] as? JsonObject)?.let(::Datum)
                      if (profile == null) profileError = "暂时无法读取个人资料"
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      // The original public user-space endpoint is a safe fallback for the header.
                      when (val fallback = container.repository.userSpace(uid)) {
                          is LoadResult.Success -> profile = fallback.value
                          is LoadResult.Error -> profileError = fallback.message
                          LoadResult.Empty -> profileError = e.message ?: "暂时无法读取个人资料"
                          LoadResult.Loading -> Unit
                      }
                  }
              }
          
              ScreenScaffold(scrollState = listState) { padding ->
                  ScalingLazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      state = listState,
                      contentPadding = padding,
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(5.dp),
                  ) {
                      item {
                          Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              Text("我的", style = MaterialTheme.typography.titleMedium, modifier = Modifier.weight(1f))
                              FilledTonalButton(onClick = onSettings) { Text("设置") }
                          }
                      }
                      if (account == null) {
                          item { LetterBadge("游", 52.dp) }
                          item { Text("游客模式", style = MaterialTheme.typography.titleMedium) }
                          item {
                              Text("登录后可使用账号收藏、点赞、关注和通知。", style = MaterialTheme.typography.bodySmall, textAlign = TextAlign.Center)
                          }
                          item { Button(onClick = onLogin, modifier = Modifier.fillMaxWidth(), label = { Text("Cookie 登录") }) }
                      } else {
                          item {
                              FilledTonalButton(
                                  onClick = { onProfile(account.uid) },
                                  modifier = Modifier.fillMaxWidth(),
                                  icon = { Avatar(profile?.userAvatar, 40.dp) },
                                  label = { Text(profile?.username ?: name.orEmpty(), maxLines = 1, overflow = TextOverflow.Ellipsis) },
                                  secondaryLabel = {
                                      val lv = profile?.text("level") ?: "?"
                                      val exp = profile?.text("experience") ?: "0"
                                      val next = profile?.text("next_level_experience") ?: "?"
                                      Text("Lv.$lv  $exp/$next", maxLines = 1)
                                  },
                              )
                          }
                          if (profile != null) {
                              item {
                                  val exp = profile?.int("experience") ?: 0
                                  val next = (profile?.int("next_level_experience") ?: 1).coerceAtLeast(1)
                                  Box(Modifier.fillMaxWidth().height(5.dp).clip(RoundedCornerShape(5.dp)).background(MaterialTheme.colorScheme.surfaceContainer)) {
                                      Box(Modifier.fillMaxWidth((exp.toFloat() / next).coerceIn(0f, 1f)).fillMaxHeight().background(Brand))
                                  }
                              }
                              item {
                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                                      ProfileStat("动态", profile?.text("feed") ?: "-", Modifier.weight(1f)) { onOpenList("USER_FEED", null) }
                                      ProfileStat("关注", profile?.text("follow") ?: "-", Modifier.weight(1f)) { onOpenList("USER_FOLLOW", null) }
                                      ProfileStat("粉丝", profile?.text("fans") ?: "-", Modifier.weight(1f)) { onOpenList("USER_FANS", null) }
                                  }
                              }
                          } else if (profileError != null) {
                              item { Text(profileError.orEmpty(), style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.error) }
                          }
                      }
          
                      item { ListHeader { Text("我的内容") } }
                      item { MenuButton("我的备份", "导出手表本地收藏和浏览记录") { onOpenList("LOCAL_BACKUP", null) } }
                      item { MenuButton("本地收藏", "${container.localFavorites.size} 条") { onOpenList("LOCAL_FAVORITES", null) } }
                      item { MenuButton("浏览历史", "${container.browseHistory.size} 条") { onOpenList("BROWSE_HISTORY", null) } }
                      if (account != null) {
                          item { MenuButton("我的常去", "账号浏览记录") { onOpenList("USER_RECENT", null) } }
                          item { MenuButton("我的收藏", "云端收藏夹") { onOpenList("CLOUD_COLLECTIONS", null) } }
                          item { MenuButton("我的赞", "我点赞过的动态") { onOpenList("USER_LIKE", null) } }
                          item { MenuButton("我的回复", "我的回复与收到的回复") { onOpenList("USER_REPLY", null) } }
                      }
                      if (account != null) {
                          item { ListHeader { Text("消息与通知") } }
                          item { MenuButton("@我的动态", "提到我的动态") { onOpenNotification("AT") } }
                          item { MenuButton("@我的评论", "提到我的评论") { onOpenNotification("COMMENT") } }
                          item { MenuButton("我收到的赞", "动态收到的赞") { onOpenNotification("LIKE") } }
                          item { MenuButton("好友关注", "关注我的好友动态") { onOpenNotification("FOLLOW") } }
                          item { MenuButton("私信", "账号私信列表") { onOpenNotification("MESSAGE") } }
                          item {
                              FilledTonalButton(onClick = { container.logout() }, modifier = Modifier.fillMaxWidth()) { Text("退出登录") }
                          }
                      }
                      item { MenuButton("关于酷安 Wear OS", "版本 $WEAR_VERSION_NAME") { onAbout() } }
                  }
              }
          }
          
          @Composable
          private fun ProfileStat(label: String, value: String, modifier: Modifier = Modifier, onClick: () -> Unit) {
              FilledTonalButton(onClick = onClick, modifier = modifier) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(value, style = MaterialTheme.typography.titleSmall)
                      Text(label, style = MaterialTheme.typography.labelSmall)
                  }
              }
          }
          
          @Composable
          private fun MenuButton(title: String, subtitle: String? = null, onClick: () -> Unit) {
              val context = LocalContext.current
              FilledTonalButton(
                  onClick = {
                      val enabled = context.getSharedPreferences("wear", Context.MODE_PRIVATE).getBoolean("haptic_enabled", true)
                      if (enabled) performWearHaptic(context)
                      onClick()
                  },
                  modifier = Modifier.fillMaxWidth(),
                  label = { Text(title, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                  secondaryLabel = subtitle?.let { { Text(it, maxLines = 1, overflow = TextOverflow.Ellipsis) } },
              )
          }
          
