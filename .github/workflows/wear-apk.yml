              private fun Modifier.watchGalleryEdgeBack(onBack: () -> Unit): Modifier = pointerInput(onBack) {
                  val edgeWidthPx = 44.dp.toPx()
                  val triggerDistancePx = 58.dp.toPx()
                  awaitEachGesture {
                      val down = awaitFirstDown(requireUnconsumed = false, pass = PointerEventPass.Initial)
                      val startedAtLeftEdge = down.position.x <= edgeWidthPx
                      val startedAtRightEdge = down.position.x >= size.width - edgeWidthPx
                      if (startedAtLeftEdge || startedAtRightEdge) {
                          var previousX = down.position.x
                          var previousY = down.position.y
                          var totalX = 0f
                          var totalY = 0f
                          var finished = false
                          while (!finished) {
                              val event = awaitPointerEvent(PointerEventPass.Initial)
                              val change = event.changes.firstOrNull { it.id == down.id } ?: break
                              val dx = change.position.x - previousX
                              val dy = change.position.y - previousY
                              previousX = change.position.x
                              previousY = change.position.y
                              if (!change.pressed) {
                                  finished = true
                              } else {
                                  totalX += dx
                                  totalY += dy
                                  val towardCenter = if (startedAtLeftEdge) totalX else -totalX
                                  if (towardCenter >= triggerDistancePx && towardCenter > kotlin.math.abs(totalY) * 1.15f) {
                                      // Initial pass runs before HorizontalPager's Main-pass gesture detector.
                                      // Consume the qualifying edge drag so the pager cannot steal the back swipe.
                                      change.consume()
                                      onBack()
                                      finished = true
                                  } else if (kotlin.math.abs(totalY) > edgeWidthPx || kotlin.math.abs(totalX) > edgeWidthPx && towardCenter < 0f) {
                                      finished = true
                                  }
                              }
                          }
                      }
                  }
