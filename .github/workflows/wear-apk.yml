# Coolapk Wear OS 0.6.21 / Galaxy Watch7 32-bit ARMv7 原版界面适配版
# 使用：将本文件放到 .github/workflows/wear-apk.yml 并提交到 main。
# 从 Fork 仓库当前提交构建，保留 :core 网络层和已有功能；恢复原版个人主页、我的、私信布局，使用原生弧形时钟和 8 个页面圆点，并在 APK 打包前先运行 Kotlin 编译预检。

name: Build Coolapk Wear OS v0.6.21 - Reference UI Restoration + ARMv7
run-name: Wear OS 0.6.21 原版主页/我的/私信、弧形时钟、圆点导航、32 位 ARMv7

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
