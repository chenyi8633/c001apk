      - name: Kotlin compile preflight - Wear OS 0.6.11
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :wear:compileReleaseKotlin --no-daemon --stacktrace --console=plain

      - name: Build Wear OS 0.6.11 32-bit ARMv7 release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :wear:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify APK 0.6.11 output and native ABI
        run: |
          set -euo pipefail
          ls -lh wear/build/outputs/apk/release/
          test -s wear/build/outputs/apk/release/wear-release.apk
          mkdir -p dist
          cp wear/build/outputs/apk/release/wear-release.apk dist/Coolapk-WearOS-v0.6.11-RootNavigation-ARMv7-GalaxyWatch7.apk
          sha256sum dist/Coolapk-WearOS-v0.6.11-RootNavigation-ARMv7-GalaxyWatch7.apk > dist/SHA256SUMS.txt
          python3 - <<'PY'
          import zipfile
          apk = 'dist/Coolapk-WearOS-v0.6.11-RootNavigation-ARMv7-GalaxyWatch7.apk'
          with zipfile.ZipFile(apk) as z:
              abis = sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and len(n.split('/')) > 2})
          print('APK native ABI folders:', abis)
          assert 'armeabi-v7a' in abis, f'ARMv7 native libs missing: {abis}'
          forbidden = {'arm64-v8a', 'x86', 'x86_64'} & set(abis)
          assert not forbidden, f'64-bit / x86 native libs unexpectedly packaged: {sorted(forbidden)}'
          with open('dist/ABI_REPORT.txt', 'w') as f:
              f.write('native_abis=' + ','.join(abis) + '\n')
              f.write('required=armeabi-v7a\n')
              f.write('64bit_or_x86=none\n')
          PY
          printf 'versionName=0.6.11\nversionCode=2026103116\ntargetSdk=37\ncompileSdk=37.2 (minorApiLevel=2)\nbuildTools=37.0.0\nabi=armeabi-v7a-only\nwearOs=6-and-7\nminSdk=30\nnetworkRecovery=validated-route-callback+single-retry\nrequestTimeout=30s\nnavigationPersistence=root-owned-navcontroller+pager+route-args+sync-checkpoint\nwebview=system-first\ngeckoview=159.0.20261022150525-armeabi-v7a\n' > dist/BUILD_INFO.txt
          printf 'source=%s\ncommit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> dist/BUILD_INFO.txt

      - name: Upload Wear APK
        uses: actions/upload-artifact@v7
        with:
          name: Coolapk-WearOS-v0.6.11-RootNavigation-ARMv7-GalaxyWatch7
          path: dist/
          if-no-files-found: error
