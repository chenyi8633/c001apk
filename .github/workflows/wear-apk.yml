# 使用：将本文件放到 .github/workflows/wear-apk.yml 并提交到 main。
# 从你 Fork 仓库当前提交构建，保留 :core 网络层；手表端单独适配圆屏 UI。

name: Build Coolapk Wear OS v0.6.16 - Original Gallery/Search + Haze + GIF - ARMv7
run-name: Wear OS 0.6.16 图片滑动、原版搜索、Haze 真模糊、GIF 动图、板块图标、新图标、32 位 ARMv7

