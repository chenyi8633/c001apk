          class WearCaptchaCoordinator {
              class Pending internal constructor(val challenge: CaptchaChallenge) {
                  internal val result = CompletableDeferred<String?>()
                  fun cancel() { result.complete(null) }
              }
          
              private val mutex = Mutex()
              private val _pending = MutableStateFlow<Pending?>(null)
              val pending: StateFlow<Pending?> = _pending.asStateFlow()
          
              suspend fun verify(challenge: CaptchaChallenge): String? = mutex.withLock {
                  val request = Pending(challenge)
                  _pending.value = request
                  try {
                      request.result.await()
                  } finally {
                      if (_pending.value === request) _pending.value = null
                  }
              }
          
              fun cancel() { _pending.value?.cancel() }
          
              /** Accept only a proof for the active challenge; never persist or log it. */
              fun acceptReturn(uri: Uri?): Boolean {
                  if (uri?.scheme != "c001apk-wear" || uri.host != "captcha") return false
                  val active = _pending.value ?: return false
                  val challengeId = uri.getQueryParameter("cid") ?: return false
                  if (challengeId != active.challenge.captchaId) return false
                  val validate = uri.getQueryParameter("validate") ?: return false
                  val proof = active.challenge.proof(validate) ?: return false
                  return active.result.complete(proof)
              }
          }
