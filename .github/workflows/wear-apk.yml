                      if (baseUrl.isNotBlank()) {
                          item {
                              ListFooter(
                                  feed,
                                  emptyText = if (visibleItems.isEmpty()) "这个板块暂时没有内容" else "没有更多了",
                              )
                          }
                      }
                  }
              }
          }
          
          @Composable
          private fun CategoryInfoCard(item: Datum) {
              val title = item.title.orEmpty()
              val description = item.description.orEmpty().ifBlank { item.text("message") }
              if (title.isBlank() && description.isBlank()) return
              Column(Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 5.dp)) {
                  if (title.isNotBlank()) Text(title, style = MaterialTheme.typography.titleSmall, maxLines = 2, overflow = TextOverflow.Ellipsis)
                  if (description.isNotBlank()) Text(
                      plainText(description),
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      maxLines = 3,
                      overflow = TextOverflow.Ellipsis,
                  )
              }
          }
          
          @Composable
          private fun PrefetchNearEnd(feed: PagedFeed, state: androidx.wear.compose.foundation.lazy.ScalingLazyListState, count: Int) {
              LaunchedEffect(state, count) {
                  androidx.compose.runtime.snapshotFlow { state.centerItemIndex }.collect { index ->
                      if (count > 0 && index >= count - 2) feed.loadNext()
                  }
              }
          }
