          package com.zailinn.c001apk.wear
          
          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import com.zailinn.c001apk.core.net.HttpsUpgrade
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.net.URLConnection
          
          /** Saves a remote image into the watch gallery without requiring storage permission on Android 10+. */
          suspend fun saveWatchImage(context: Context, http: OkHttpClient, rawUrl: String): Result<Unit> = withContext(Dispatchers.IO) {
              runCatching {
                  val url = HttpsUpgrade.url(rawUrl) ?: error("图片地址无效")
                  val request = Request.Builder().url(url).build()
                  http.newCall(request).execute().use { response ->
                      check(response.isSuccessful) { "下载失败（HTTP ${response.code}）" }
                      val body = response.body ?: error("图片内容为空")
                      check(body.contentLength() <= 64L * 1024 * 1024) { "图片过大" }
                      val mime = body.contentType()?.toString()
                          ?: URLConnection.guessContentTypeFromName(url.substringBefore('?'))
                          ?: "image/jpeg"
                      val ext = when {
                          mime.contains("png") -> ".png"
                          mime.contains("webp") -> ".webp"
                          mime.contains("gif") -> ".gif"
                          else -> ".jpg"
                      }
                      val name = "coolapk_${System.currentTimeMillis()}$ext"
                      val resolver = context.contentResolver
                      val values = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          put(MediaStore.Images.Media.MIME_TYPE, mime)
                          if (Build.VERSION.SDK_INT >= 29) {
                              put(MediaStore.Images.Media.RELATIVE_PATH, "${Environment.DIRECTORY_PICTURES}/c001apk")
                              put(MediaStore.Images.Media.IS_PENDING, 1)
                          }
                      }
                      val collection = MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                      val uri = resolver.insert(collection, values) ?: error("无法创建相册文件")
                      try {
                          resolver.openOutputStream(uri)?.use { out ->
                              body.byteStream().use { input ->
                                  val buffer = ByteArray(64 * 1024)
                                  var total = 0L
                                  while (true) {
                                      val read = input.read(buffer)
                                      if (read < 0) break
                                      total += read
                                      check(total <= 64L * 1024 * 1024) { "图片过大" }
                                      out.write(buffer, 0, read)
                                  }
                              }
                          }
                              ?: error("无法写入图片")
                          if (Build.VERSION.SDK_INT >= 29) {
                              resolver.update(uri, ContentValues().apply { put(MediaStore.Images.Media.IS_PENDING, 0) }, null, null)
                          }
                      } catch (e: Exception) {
                          resolver.delete(uri, null, null)
                          throw e
                      }
                  }
              }
          }
