          assert 'val anchor = cards.getOrNull(centerIndex - 1)' in channel
          assert 'tappedIndex' not in channel
          assert channel.index('val cards = remember(feed.items, container.settingsRevision)') < channel.index('LaunchedEffect(state, durableFeedKey, cards, restoring)')
          # Regression simulation: a failed or partial restore cannot lower the last known page count.
