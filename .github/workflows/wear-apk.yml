          import com.zailinn.c001apk.core.net.ApiFailureKind
          
          /**
           * Observes the system's default validated internet route. This does not keep Wi-Fi
           * awake, poll in the background, start a service, or depend on a paired phone.
           */
          class WearNetworkMonitor(context: Context) {
              private val manager = context.applicationContext
                  .getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
          
              private val _validatedInternet = MutableStateFlow(readValidatedInternet())
              val validatedInternet = _validatedInternet.asStateFlow()
          
              private val callback = object : ConnectivityManager.NetworkCallback() {
                  override fun onAvailable(network: Network) { refresh() }
                  override fun onLost(network: Network) { refresh() }
                  override fun onCapabilitiesChanged(network: Network, networkCapabilities: NetworkCapabilities) { refresh() }
              }
          
              init {
                  // Register once for the app process. A failed registration must not block app startup.
                  runCatching { manager.registerDefaultNetworkCallback(callback) }
                  refresh()
              }
          
              private fun readValidatedInternet(): Boolean {
                  val active = runCatching { manager.activeNetwork }.getOrNull() ?: return false
                  val caps = runCatching { manager.getNetworkCapabilities(active) }.getOrNull() ?: return false
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) &&
                      caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)
              }
          
              fun refresh(): Boolean {
                  val available = readValidatedInternet()
                  _validatedInternet.value = available
                  return available
              }
          
              /** Wait for an actual validated route, not merely a connected Wi-Fi radio. */
              suspend fun awaitValidatedInternet(timeoutMs: Long = 10_000L): Boolean {
                  if (!refresh()) {
                      val arrived = withTimeoutOrNull(timeoutMs) {
                          validatedInternet.first { it }
                      } ?: false
                      if (!arrived) return false
                  }
                  // Allow the newly selected default route and DNS to settle before one retry.
                  delay(550L)
                  return refresh()
              }
          
              /** Retry a one-shot screen request once after a transient transport failure. */
              suspend fun <T> withRecovery(request: suspend () -> LoadResult<T>): LoadResult<T> {
                  val first = request()
                  if (first !is LoadResult.Error || first.kind != ApiFailureKind.Transport) return first
                  if (!awaitValidatedInternet()) {
                      return LoadResult.Error(OFFLINE_MESSAGE, ApiFailureKind.Transport)
                  }
                  return request()
              }
          
