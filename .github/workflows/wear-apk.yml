          assert 'geckoview-armeabi-v7a:159.0.20261022150525' in build
          assert 'arm64-v8a' not in build
          print(f'Validated 8-entry single navigation rail, on-watch WebView/GeckoView proof callback, manifest and {len(kotlin)} Kotlin files; ABI filter is armeabi-v7a only.')
          PY
          python3 -m py_compile /tmp/patch_wear_064.py /tmp/patch_wear_066.py /tmp/patch_wear_067_network.py /tmp/patch_wear_068_navigation.py /tmp/patch_wear_069_return.py
          echo 'Wear OS 0.6.11 root navigation, list restore, glass UI, bounded network recovery, Wear OS 6/7 and ARMv7-only checks passed.'
          python3 - <<'PY'
          from pathlib import Path
          app = Path('wear/src/main/kotlin/com/zailinn/c001apk/wear/WearApp.kt').read_text()
          assert 'rememberPagerState(initialPage = lastChannelPage) { 8 }' in app
          assert 'LaunchedEffect(configuredHome)' not in app
          assert 'pending_home_channel' in app
          channel = Path('wear/src/main/kotlin/com/zailinn/c001apk/wear/ChannelScreens.kt').read_text()
          assert 'while (feed.successfulPages < targetPages && !feed.ended)' in channel
