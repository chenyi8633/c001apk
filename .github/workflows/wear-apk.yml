          @Composable
          fun MineListScreen(
              container: WearContainer,
              type: String,
              id: String?,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
              onOpenList: (String, String?) -> Unit,
          ) {
              val uid = container.account?.uid.orEmpty()
              var replyTab by remember(type) { mutableIntStateOf(0) }
              val effectiveType = if (type == "USER_REPLY" && replyTab == 1) "USER_REPLY_TO_ME" else type
              val title = when (type) {
                  "LOCAL_BACKUP" -> "我的备份"
                  "LOCAL_FAVORITES" -> "本地收藏"
                  "BROWSE_HISTORY" -> "浏览历史"
                  "USER_FEED" -> "我的动态"
                  "USER_FOLLOW" -> "我的关注"
                  "USER_FANS" -> "我的粉丝"
                  "USER_RECENT" -> "我的常去"
                  "USER_LIKE" -> "我的赞"
                  "USER_REPLY" -> "我的回复"
                  "USER_REPLY_TO_ME" -> "收到的回复"
                  "CLOUD_COLLECTIONS" -> "我的收藏"
                  "COLLECTION_ITEMS" -> "收藏夹内容"
                  "NOTIFY_AT" -> "@我的动态"
                  "NOTIFY_COMMENT" -> "@我的评论"
                  "NOTIFY_LIKE" -> "我收到的赞"
                  "NOTIFY_FOLLOW" -> "好友关注"
                  "NOTIFY_MESSAGE" -> "私信"
                  else -> "我的内容"
              }
              val remoteList = remember(effectiveType, id, uid, container.accountVersion) {
                  PagedFeed { page ->
                      when (effectiveType) {
                          "USER_FEED" -> container.repository.userFeed(uid, page)
                          "USER_FOLLOW" -> container.repository.dataListFromUrl("/v6/user/followList", listOf("uid" to uid) + page.query())
                          "USER_FANS" -> container.repository.dataListFromUrl("/v6/user/fansList", listOf("uid" to uid) + page.query())
                          "USER_RECENT" -> container.repository.dataListFromUrl("/v6/user/recentHistoryList", listOf("uid" to uid) + page.query())
                          "USER_LIKE" -> container.repository.dataListFromUrl("/v6/user/likeList", listOf("uid" to uid) + page.query())
                          "USER_REPLY" -> container.repository.dataListFromUrl("/v6/user/replyList", listOf("uid" to uid) + page.query())
                          "USER_REPLY_TO_ME" -> container.repository.dataListFromUrl("/v6/user/replyToMeList", listOf("uid" to uid) + page.query())
                          "CLOUD_COLLECTIONS" -> container.repository.dataListFromUrl("/v6/collection/list", listOf("showDefault" to "0") + page.query())
                          "COLLECTION_ITEMS" -> container.repository.dataListFromUrl("/v6/collection/itemList", listOf("id" to id.orEmpty()) + page.query())
                          "NOTIFY_AT" -> container.repository.notifications("/v6/notification/atMeList", page)
                          "NOTIFY_COMMENT" -> container.repository.notifications("/v6/notification/atCommentMeList", page)
                          "NOTIFY_LIKE" -> container.repository.notifications("/v6/notification/feedLikeList", page)
                          "NOTIFY_FOLLOW" -> container.repository.notifications("/v6/notification/contactsFollowList", page)
                          "NOTIFY_MESSAGE" -> container.repository.notifications("/v6/message/list", page)
                          else -> LoadResult.Empty
                      }
                  }
              }
              val context = LocalContext.current
              val localRows = when (type) {
                  "LOCAL_FAVORITES" -> container.localFavorites
                  "BROWSE_HISTORY" -> container.browseHistory
                  else -> emptyList()
              }
              val state = rememberScalingLazyListState()
              LaunchedEffect(remoteList, effectiveType) {
                  if (effectiveType !in setOf("LOCAL_BACKUP", "LOCAL_FAVORITES", "BROWSE_HISTORY")) remoteList.loadNext()
              }
              ScreenScaffold(scrollState = state) { padding ->
                  ScalingLazyColumn(Modifier.fillMaxSize(), state = state, contentPadding = padding, horizontalAlignment = Alignment.CenterHorizontally) {
                      item { ListHeader { Text(title) } }
                      if (type == "USER_REPLY") {
                          item {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                  ChoiceButton("我的回复", replyTab == 0, { replyTab = 0 }, Modifier.weight(1f))
                                  ChoiceButton("收到的回复", replyTab == 1, { replyTab = 1 }, Modifier.weight(1f))
                              }
                          }
                      }
                      when (type) {
                          "LOCAL_BACKUP" -> {
                              item { Text("本机收藏 ${container.localFavorites.size} 条 · 浏览记录 ${container.browseHistory.size} 条", style = MaterialTheme.typography.bodySmall, textAlign = TextAlign.Center) }
                              item {
                                  val context = LocalContext.current
                                  Button(onClick = { copyText(context, "Coolapk Wear OS backup", container.exportLocalBackup()) }, modifier = Modifier.fillMaxWidth(), label = { Text("复制备份索引") })
