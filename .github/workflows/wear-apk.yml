          @Composable
          fun ReplyThreadScreen(
              container: WearContainer,
              origin: Datum,
              feedId: String,
              onUser: (String) -> Unit,
          ) {
              val context = LocalContext.current
              var browserNotice by remember { mutableStateOf<String?>(null) }
              val list = remember(origin.id, container.accountVersion) {
                  PagedFeed { page ->
                      try {
                          container.repository.subReplies(origin.id.orEmpty(), page).result
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          LoadResult.Error(ApiFailure.from(e).message)
                      }
                  }
              }
              val state = rememberScalingLazyListState()
              ScreenScaffold(scrollState = state) { padding ->
                  ScalingLazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      state = state,
                      contentPadding = padding,
                  ) {
                      item { ListHeader { Text("评论回复") } }
                      item {
                          ReplyCard(origin, onUser = onUser, onOpenThread = { })
                      }
                      item {
                          Text("若完整回复触发酷安人机验证，可在外部浏览器打开原帖查看。浏览器验证不会自动同步到手表客户端。", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant, textAlign = TextAlign.Center)
                      }
                      item {
                          Button(onClick = {
                              if (!openCoolapkPost(context, feedId) { browserNotice = it }) browserNotice = "无法启动手机或手表浏览器，请复制原帖链接。"
                          }, modifier = Modifier.fillMaxWidth(), label = { Text("在配对手机查看完整回复") })
                      }
                      item {
                          FilledTonalButton(onClick = {
                              if (!openCoolapkPostOnWatch(context, feedId)) browserNotice = "手表没有可用浏览器。"
                          }, modifier = Modifier.fillMaxWidth(), label = { Text("改用手表浏览器") })
                      }
                      item {
                          FilledTonalButton(
                              onClick = { copyCoolapkPostUrl(context, feedId); browserNotice = "原帖链接已复制，可以粘贴到手机浏览器。" },
                              modifier = Modifier.fillMaxWidth(),
                              label = { Text("复制原帖链接") },
                          )
                      }
                      browserNotice?.let { item { Text(it, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.error) } }
                      if (list.items.isEmpty() && list.error == null) {
                          item {
                              Text(
                                  "正在加载更多回复…",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  textAlign = TextAlign.Center,
                              )
                          }
                      }
                      val loadedReplies = list.items.filter { it.id != origin.id }
                      val fallbackPreviews = if (loadedReplies.isEmpty() && list.error != null) origin.replyRows else emptyList()
                      if (fallbackPreviews.isNotEmpty()) {
                          item { Text("接口要求验证，以下为原帖已公开的回复预览：", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant) }
                      }
                      items(if (loadedReplies.isNotEmpty()) loadedReplies else fallbackPreviews,
                          key = { it.entityId ?: it.id ?: it.hashCode().toString() }) { reply ->
                          ReplyCard(reply, onUser = onUser, onOpenThread = { })
                      }
                      item {
                          ListFooter(
                              list,
                              emptyText = if (list.error != null) "完整回复暂不可读取，已保留原帖回复预览" else "没有更多回复了",
                          )
                      }
                  }
              }
              LaunchedEffect(list.loadedPages) {
                  if (list.loadedPages == 0) list.loadNext()
              }
          }
          
          @Composable
          fun UserScreen(
              container: WearContainer,
              uid: String,
              onOpenFeed: (Datum) -> Unit,
              onOpenUser: (String) -> Unit,
              onOpenTarget: (Datum) -> Unit,
              onImages: (List<String>, Int) -> Unit,
          ) {
              var info by remember(uid) { mutableStateOf<Datum?>(null) }
              var failure by remember(uid) { mutableStateOf<String?>(null) }
              var notice by remember(uid) { mutableStateOf<String?>(null) }
              val scope = rememberCoroutineScope()
          
              LaunchedEffect(uid) {
                  when (val result = container.repository.userSpace(uid)) {
                      is LoadResult.Success -> info = result.value
                      is LoadResult.Error -> failure = result.message
                      else -> Unit
                  }
              }
              val feeds = remember(uid, container.accountVersion) {
                  PagedFeed { page -> container.repository.userFeed(uid, page) }
              }
              val cards = remember(feeds.items) { container.visibleFeeds(feeds.items) }
              val listState = rememberScalingLazyListState()
              PrefetchWhenNearEnd(feeds, listState, cards.size)
          
              fun toggleFollow() {
                  val current = info ?: return
                  if (!container.session.isLogin) {
                      notice = "登录后才能关注"
                      return
                  }
                  val following = current.int("isFollow") == 1
                  scope.launch {
                      try {
                          val url = if (following) "/v6/user/unfollow" else "/v6/user/follow"
                          val result = container.repository.postAction(url, uid = uid)
                          info = current.with("isFollow", result.dataText?.toIntOrNull() ?: if (following) 0 else 1)
                          notice = null
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          notice = ApiFailure.from(e).message
                      }
                  }
              }
          
              ScreenScaffold(scrollState = listState) { padding ->
                  ScalingLazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      state = listState,
                      contentPadding = padding,
                      horizontalAlignment = Alignment.CenterHorizontally,
                  ) {
                      val data = info
                      if (data == null) {
                          item { if (failure != null) Text(failure.orEmpty(), style = MaterialTheme.typography.bodySmall) else PulsingText("加载中…") }
                      } else {
                          item {
                              Avatar(
                                  data.userAvatar,
                                  64.dp,
                                  Modifier.clickable { data.userAvatar?.let { onImages(listOf(fullUrl(it)), 0) } },
                              )
                          }
                          item {
                              Text(
                                  data.username.orEmpty(),
                                  style = MaterialTheme.typography.titleMedium,
                                  color = Brand,
                                  textAlign = TextAlign.Center,
                                  maxLines = 2,
                              )
                          }
                          item {
                              Text(
                                  "Lv.${data.text("level")}   ${data.text("feed")}动态   ${data.text("be_like_num")}赞",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  textAlign = TextAlign.Center,
                              )
                          }
                          item {
                              Text(
                                  "${data.text("follow")}关注   ${data.text("fans")}粉丝",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  textAlign = TextAlign.Center,
                              )
                          }
                          data.string("bio")?.takeIf { it.isNotBlank() }?.let { bio ->
                              item {
                                  Text(
                                      plainText(bio),
                                      style = MaterialTheme.typography.bodySmall,
                                      textAlign = TextAlign.Center,
                                      maxLines = 4,
                                      overflow = TextOverflow.Ellipsis,
                                  )
                              }
                          }
                          item {
                              val following = data.int("isFollow") == 1
                              ChoiceButton(
                                  text = if (following) "已关注" else "关注",
                                  selected = !following,
                                  onClick = ::toggleFollow,
                                  modifier = Modifier.fillMaxWidth(),
                              )
                          }
                          notice?.let { message ->
                              item {
                                  Text(
                                      message,
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.error,
                                      textAlign = TextAlign.Center,
                                  )
                              }
                          }
                          item { ListHeader { Text("动态") } }
                          items(cards, key = { it.entityId ?: it.id ?: it.hashCode().toString() }) { feedItem ->
                              FeedCard(feedItem, onClick = { onOpenFeed(feedItem) }, onUser = onOpenUser, onTarget = onOpenTarget)
                          }
                          item { ListFooter(feeds, emptyText = if (cards.isEmpty()) "还没有动态" else "没有更多了") }
                      }
                  }
              }
          }
          
          @Composable
          private fun PrefetchWhenNearEnd(feed: PagedFeed, listState: androidx.wear.compose.foundation.lazy.ScalingLazyListState, count: Int) {
              LaunchedEffect(listState, count) {
                  androidx.compose.runtime.snapshotFlow { listState.centerItemIndex }.collect { index ->
                      if (count > 0 && index >= count - 2) feed.loadNext()
                  }
              }
          }
