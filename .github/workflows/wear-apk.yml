                  sortCard?.entities.orEmpty().filter { !it.title.isNullOrBlank() && !it.url.isNullOrBlank() }
              }
              LaunchedEffect(sortCard) {
                  if (sortCard != null && selectedSortUrl == null && sortOptions.isNotEmpty()) {
                      val selectedTab = sortCard.obj("extraData")?.string("selectedTab") ?: runCatching {
                          val raw = sortCard.text("extraData")
                          val parsed = kotlinx.serialization.json.Json.parseToJsonElement(raw) as? kotlinx.serialization.json.JsonObject
                          (parsed?.get("selectedTab") as? kotlinx.serialization.json.JsonPrimitive)?.content
                      }.getOrNull()
