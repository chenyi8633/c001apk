name: Build Wear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Pick module to build
        id: pick
        run: |
          if [ -d wear ]; then
            echo "task=:wear:assembleDebug" >> "$GITHUB_OUTPUT"
          else
            echo "task=:app:assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: ./gradlew ${{ steps.pick.outputs.task }} --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
