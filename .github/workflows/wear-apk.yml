# 从 Fork 仓库当前提交构建，保留 :core 网络层；只修正 0.6.16 的 Kotlin 编译错误。

name: Build Coolapk Wear OS v0.6.18 - Compile Fix + ARMv7
run-name: Wear OS 0.6.18 编译修复、社交功能保留、32 位 ARMv7

