# Coolapk Wear OS 0.6.27 / Galaxy Watch7 ARMv7 - Gallery back fix + Material 3 image viewer
# 使用：将本文件放到 .github/workflows/wear-apk.yml 并提交到 main。
# 从 Fork 仓库当前提交构建，保留 :core 网络层和已有功能；恢复原版个人主页、我的、私信布局，使用原生弧形时钟和 8 个页面圆点，并在 APK 打包前先运行 Kotlin 编译预检。

