# Coolapk Wear OS 0.6.23 / Galaxy Watch7 32-bit ARMv7 Material 3 Compose-scope fix
# 使用：将本文件放到 .github/workflows/wear-apk.yml 并提交到 main。
# 从 Fork 仓库当前提交构建，保留 :core 网络层和已有功能；恢复原版个人主页、我的、私信布局，使用原生弧形时钟和 8 个页面圆点，并在 APK 打包前先运行 Kotlin 编译预检。

name: Build Coolapk Wear OS v0.6.23 - Material 3 UI Polish + ARMv7
run-name: Wear OS 0.6.23 Compose 修复、Material 3、原版社交功能、32 位 ARMv7

on:
  push:
    branches: [main]
  workflow_dispatch:

