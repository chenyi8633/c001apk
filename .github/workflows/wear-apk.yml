                                      FilledTonalButton(
                                          onClick = {
                                              val nextUrl = option.url.orEmpty()
                                              if (nextUrl.isNotBlank() && nextUrl != activeUrl) {
                                                  selectedSortUrl = nextUrl
                                                  activeUrl = nextUrl
                                                  feed.reset()
                                              }
                                          },
                                      ) {
                                          Text(
                                              option.title.orEmpty() + if (selectedSortUrl == option.url) " ✓" else "",
                                              maxLines = 1,
                                          )
                                      }
                                  }
                              }
                          }
                      }
                      items(visibleItems, key = { it.entityId ?: it.id ?: it.hashCode().toString() }) { item ->
                          when (item.entityType) {
                              "feed" -> FeedCard(
                                  item,
                                  onClick = { onOpenFeed(item) },
                                  onUser = onOpenUser,
                                  onTarget = onOpenTarget,
                              )
                              "product", "topic" -> FilledTonalButton(
                                  onClick = { onOpenTarget(item) },
                                  modifier = Modifier.fillMaxWidth(),
                                  icon = { if (!item.logo.isNullOrBlank()) Avatar(item.logo, 30.dp) },
                                  label = {
                                      Text(item.title.orEmpty().ifBlank { "查看板块" }, maxLines = 2, overflow = TextOverflow.Ellipsis)
                                  },
                                  secondaryLabel = {
                                      Text(
                                          listOfNotNull(
                                              item.string("hot_num_txt")?.let { "${it}热度" },
                                              item.string("feed_comment_num_txt")?.let { "${it}讨论" },
                                          ).joinToString(" · ").ifBlank { "进入详情" },
                                          maxLines = 1,
                                      )
                                  },
                              )
                              "user" -> FilledTonalButton(
                                  onClick = { item.uid?.let(onOpenUser); Unit },
                                  modifier = Modifier.fillMaxWidth(),
                                  icon = { Avatar(item.userAvatar, 28.dp) },
                                  label = { Text(item.username.orEmpty(), maxLines = 1, overflow = TextOverflow.Ellipsis) },
                                  secondaryLabel = { Text("查看用户主页", maxLines = 1) },
                              )
                              "card" -> CategoryInfoCard(item)
                              else -> CategoryInfoCard(item)
