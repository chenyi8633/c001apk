      - name: Apply Wear OS 0.6.10 native back-stack state preservation fix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch_wear_0610_navigation.py <<'PY'
          from pathlib import Path

          PKG = Path('wear/src/main/kotlin/com/zailinn/c001apk/wear')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Do not force a second restoration when the existing NavHost returns to Home.
          # PagerState/ListState are already owned above NavHost and therefore survive a normal
          # push/pop. SharedPreferences restoration is still performed when the Home content is
          # genuinely recreated; a back press must not overwrite live Compose state with a snapshot.
          p = PKG / 'WearApp.kt'
          s = p.read_text()
          start = s.index('                val currentEntry by navController.currentBackStackEntryAsState()')
          end = s.index('                val args = remember { NavArgs() }', start)
          old_block = s[start:end]
          if 'requestHomeRestore()' not in old_block or 'previousRoute' not in old_block:
              raise RuntimeError('WearApp: expected 0.6.9 return-event observer was not found')
          new_block = '''                val currentEntry by navController.currentBackStackEntryAsState()
                          LaunchedEffect(currentEntry?.destination?.route) {
                              if (currentEntry?.destination?.route == "home" && container.getBool("refresh_on_return", false)) {
                                  container.requestHomeRefresh()
                              }
                          }
          '''
          s = s[:start] + new_block + s[end:]
          p.write_text(s)

          p = PKG / 'WearContainer.kt'
          s = p.read_text()
          s = replace_once(
              s,
              '    var homeReturnRevision by mutableIntStateOf(0)\n        private set\n',
              '',
              'Remove custom home-return revision',
          )
          s = replace_once(
              s,
              '    fun requestHomeRestore() { homeReturnRevision++ }\n',
              '',
              'Remove custom home-return trigger',
          )
          p.write_text(s)

          p = PKG / 'ChannelScreens.kt'
          s = p.read_text()
          s = replace_once(
              s,
              '    val homeReturnRevision = container.homeReturnRevision\n',
              '',
              'Remove forced restore event from channel screen',
          )
          s = replace_once(
              s,
              'LaunchedEffect(feed, refreshRevision, homeReturnRevision, durableFeedKey)',
              'LaunchedEffect(feed, refreshRevision, durableFeedKey)',
              'Restore only when feed or its real refresh lifecycle changes',
          )
          p.write_text(s)

          # Advance the displayed and package version for this regression-fix iteration.
          p = PKG / 'MoreScreens.kt'
          s = p.read_text()
          s = s.replace('const val WEAR_VERSION_NAME = "0.6.9"', 'const val WEAR_VERSION_NAME = "0.6.10"')
          s = s.replace('"酷安 Wear OS 版 0.6.9"', '"酷安 Wear OS 版 0.6.10"')
          p.write_text(s)

          p = Path('wear/build.gradle.kts')
          s = p.read_text()
          s = replace_once(s, 'versionCode = 2026103114', 'versionCode = 2026103115', 'Wear versionCode')
          s = replace_once(s, 'versionName = "0.6.9"', 'versionName = "0.6.10"', 'Wear versionName')
          p.write_text(s)

          app = (PKG / 'WearApp.kt').read_text()
          channel = (PKG / 'ChannelScreens.kt').read_text()
          container = (PKG / 'WearContainer.kt').read_text()
          assert 'navController.popBackStack()' in app
          assert 'requestHomeRefresh()' in app
          assert 'requestHomeRestore' not in app and 'previousRoute' not in app
          assert 'homeReturnRevision' not in container and 'homeReturnRevision' not in channel
          assert 'LaunchedEffect(feed, refreshRevision, durableFeedKey)' in channel
          assert 'val positionToRestore = container.getChannelScrollPosition(durableFeedKey)' in channel
          assert 'saveNavigationInt("last_channel_page", page, flush = true)' in app
          assert 'channelPagerState.settledPage, flush = true' in app
          build = Path('wear/build.gradle.kts').read_text()
          assert 'versionName = "0.6.10"' in build and 'versionCode = 2026103115' in build
          print('0.6.10 native back-stack preservation and cold-recreation-only state restore checks passed')
          PY
          python3 -m py_compile /tmp/patch_wear_0610_navigation.py
          python3 /tmp/patch_wear_0610_navigation.py

      - name: Apply Wear OS 0.6.11 root-owned navigation controller and state
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch_wear_0611_root_navigation.py <<'PY'
          from pathlib import Path

          pkg = Path('wear/src/main/kotlin/com/zailinn/c001apk/wear')
          app_file = pkg / 'WearApp.kt'
          app = app_file.read_text()

          def move_one(line: str, label: str) -> str:
              global app
              count = app.count(line)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one declaration, found {count}')
              app = app.replace(line, '', 1)
              return line

          # The destination controller must have the same lifetime as WearApp, not the
          # AppScaffold slot. The route argument maps must live with it, too: a detail route
          # can otherwise survive while its in-memory Datum payload is recreated empty.
          declarations = [
              move_one('                val navController = rememberSwipeDismissableNavController()\n', 'NavController'),
              move_one('                val args = remember { NavArgs() }\n', 'NavArgs'),
              move_one('                val homeFeed = remember { container.newPagedFeed { page -> container.repository.homeFeed(page, 1, container.installTime) } }\n', 'homeFeed'),
              move_one('                val homeList = rememberScalingLazyListState()\n', 'homeList'),
              move_one('                var results by remember { mutableStateOf<PagedFeed?>(null) }\n', 'results state'),
              move_one('                val resultsList = rememberScalingLazyListState()\n', 'resultsList'),
          ]
          account_effect = chr(10).join([
              '                LaunchedEffect(container.accountVersion) {',
              '                    if (container.accountVersion > 0) homeFeed.reset()',
              '                }',
          ]) + chr(10)
          if app.count(account_effect) != 1:
              raise RuntimeError('Account-version feed reset effect was not found exactly once')
          app = app.replace(account_effect, '', 1)

          root_anchor = '            Box(Modifier.fillMaxSize()) {\n'
          if app.count(root_anchor) != 1:
              raise RuntimeError('WearApp root Box insertion point was not found exactly once')
          root_block = chr(10).join([
              '            val navController = rememberSwipeDismissableNavController()',
              '            val args = remember { NavArgs() }',
              '            val homeFeed = remember { container.newPagedFeed { page -> container.repository.homeFeed(page, 1, container.installTime) } }',
              '            val homeList = rememberScalingLazyListState()',
              '            var results by remember { mutableStateOf<PagedFeed?>(null) }',
              '            val resultsList = rememberScalingLazyListState()',
              '            LaunchedEffect(container.accountVersion) {',
              '                if (container.accountVersion > 0) homeFeed.reset()',
              '            }',
          ]) + chr(10)
          app = app.replace(root_anchor, root_block + root_anchor, 1)

          # Keep the lifecycle return observer inside the UI slot, but insist that it reads
          # the one root-owned controller. The controller itself must precede AppScaffold.
          scaffold = app.index('AppScaffold {')
          controller = app.index('val navController = rememberSwipeDismissableNavController()')
          args_pos = app.index('val args = remember { NavArgs() }')
          assert controller < scaffold and args_pos < scaffold
          assert app.count('val navController = rememberSwipeDismissableNavController()') == 1
          assert app.count('val args = remember { NavArgs() }') == 1
          assert 'navController.popBackStack()' in app
          assert 'rememberPagerState(initialPage = lastChannelPage) { 8 }' in app
          assert 'val retainedChannelFeeds = remember { mutableMapOf<String, PagedFeed>() }' in app
          app_file.write_text(app)

          # Bump the app/package version. No navigation route or user-facing feature is removed.
          more_file = pkg / 'MoreScreens.kt'
          more = more_file.read_text()
          if 'const val WEAR_VERSION_NAME = "0.6.10"' not in more:
              raise RuntimeError('Expected app version 0.6.10 in MoreScreens.kt')
          more = more.replace('const val WEAR_VERSION_NAME = "0.6.10"', 'const val WEAR_VERSION_NAME = "0.6.11"', 1)
          more = more.replace('"酷安 Wear OS 版 0.6.10"', '"酷安 Wear OS 版 0.6.11"', 1)
          more_file.write_text(more)

          build_file = Path('wear/build.gradle.kts')
          build = build_file.read_text()
          if build.count('versionCode = 2026103115') != 1 or build.count('versionName = "0.6.10"') != 1:
              raise RuntimeError('Expected exactly one 0.6.10 version pair in wear/build.gradle.kts')
          build = build.replace('versionCode = 2026103115', 'versionCode = 2026103116', 1)
          build = build.replace('versionName = "0.6.10"', 'versionName = "0.6.11"', 1)
          build_file.write_text(build)

          print('0.6.11 root-owned NavController, route arguments, feed state and back-stack checks passed')
          PY
          python3 -m py_compile /tmp/patch_wear_0611_root_navigation.py
          python3 /tmp/patch_wear_0611_root_navigation.py

