          package com.zailinn.c001apk.wear
          
          import android.text.Html
          import android.util.LruCache
          import com.zailinn.c001apk.core.model.Datum
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          
          private val plainCache = LruCache<String, String>(300)
          
          /** Shared by Compose text rendering; Wear displays common Coolapk markers as Unicode emoji. */
          internal object WearTextPreferences {
              @Volatile var showCoolapkEmoji: Boolean = true
          }
          
          private val emojiMarker = Regex("\\[[^\\[\\]]{1,12}]")
          private val watchEmojiFallbacks = mapOf(
              "[哈哈哈]" to "🤣", "[惊讶]" to "😲", "[呲牙]" to "😁", "[流泪]" to "😢",
              "[可爱]" to "🥰", "[微笑]" to "🙂", "[呵呵]" to "😅", "[撇嘴]" to "😒",
              "[色]" to "😍", "[傲慢]" to "😏", "[疑问]" to "❓", "[无语]" to "😶",
              "[坏笑]" to "😏", "[鄙视]" to "🙄", "[发怒]" to "😡", "[托腮]" to "🤔",
              "[吐舌]" to "😛", "[汗]" to "😓", "[亲亲]" to "😘", "[喷血]" to "🤯",
              "[睡]" to "😴", "[捂嘴笑]" to "🤭", "[再见]" to "👋", "[可怜]" to "🥺",
              "[笑哭]" to "😂", "[强]" to "👍", "[弱]" to "👎", "[抱拳]" to "🙏",
              "[ok]" to "👌", "[嘿哈]" to "😎", "[捂脸]" to "🤦", "[机智]" to "🧐",
              "[耶]" to "✌️", "[doge]" to "🐶", "[滑稽]" to "😏", "[吃瓜]" to "🍉",
              "[爱心]" to "❤️", "[心碎]" to "💔", "[玫瑰]" to "🌹", "[酷安]" to "🟢",
          )
          
          /** The server sends HTML in messages; the watch shows cached plain text and optional emoji markers. */
          fun plainText(html: String): String {
              if (html.isEmpty()) return ""
              val result = plainCache.get(html) ?: runCatching {
                  Html.fromHtml(html.replace("\n", "<br>"), Html.FROM_HTML_MODE_LEGACY).toString()
              }.getOrDefault(html.replace(Regex("<[^>]*>"), ""))
                  .replace('\uFFFC', ' ')
                  .trim()
                  .also { plainCache.put(html, it) }
              if (!WearTextPreferences.showCoolapkEmoji) return result
              return emojiMarker.replace(result) { match -> watchEmojiFallbacks[match.value] ?: match.value }
          }
          
          /** Server-side thumbnail: far less data than the original, which is plenty for a watch. */
          fun thumbnail(url: String): String {
              val full = fullUrl(url)
              return if (full.endsWith(".s.jpg")) full else "$full.s.jpg"
          }
          
          fun fullUrl(url: String): String = if (url.startsWith("//")) "https:$url" else url
          
          val Datum.avatarUrl: String? get() = userInfo?.userAvatar ?: userAvatar
          
          val Datum.authorUid: String? get() = userInfo?.uid ?: uid
          
          fun relativeTime(seconds: Long?): String {
              if (seconds == null) return ""
              val diff = System.currentTimeMillis() / 1000 - seconds
              return when {
                  diff < 60 -> "刚刚"
                  diff < 3600 -> "${diff / 60}分钟前"
                  diff < 86400 -> "${diff / 3600}小时前"
                  diff < 86400 * 30 -> "${diff / 86400}天前"
                  else -> SimpleDateFormat("yyyy-MM-dd", Locale.CHINA).format(Date(seconds * 1000))
              }
          }
