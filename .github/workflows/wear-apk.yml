      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 37.2 platform and Build Tools 37.0.0
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-01.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add Wear OS module
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-02.sh
      - name: Apply Wear OS 0.6.5 navigation, embedded CAPTCHA and ARMv7 patches
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-03.sh
      - name: Apply Wear OS 0.6.7 back-stack, frosted glass and battery optimizations
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-04.sh
      - name: Apply Wear OS 0.6.7 network recovery and startup safeguards
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-05.sh
      - name: Apply Wear OS 0.6.8 persistent tab, list restoration and animation polish
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-06.sh
      - name: Apply Wear OS 0.6.9 actual return-event restoration fix
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-07.sh
      - name: Apply Wear OS 0.6.10 native back-stack state preservation fix
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-08.sh
      - name: Apply Wear OS 0.6.11 root-owned navigation controller and state
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-09.sh
      - name: Apply Wear OS 0.6.12 all-channel sessions and Gaussian glass materials
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-10.sh
      - name: Fix Wear OS 0.6.12 full-screen Gaussian rail measurement regression
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-11.sh
      - name: Apply Wear OS 0.6.14 opaque frosted UI, 12-hour arc clock and page indicators
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-12.sh
      - name: Verify Wear OS 0.6.14 opaque frosted UI, clock, page indicators, all-channel state and ARMv7 ABI
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-13.sh
      - name: Apply Wear OS 0.6.15 gallery, search, Haze, GIF and launcher icon prerequisite
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-14.sh
      - name: Verify Wear OS 0.6.15 restored interaction, media, blur and ABI
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-15.sh
      - name: Apply Wear OS 0.6.16 full social, web login, Haze and media restoration
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-16.sh
      - name: Verify Wear OS 0.6.16 final source and interactions
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-17.sh
      - name: Apply 0.6.18 Kotlin compile corrections, API alignment and compile preflight
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-18.sh
      - name: Build Wear OS 0.6.18 32-bit ARMv7 release APK
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-19.sh
      - name: Verify APK 0.6.18 output and native ABI
        shell: bash
        run: bash .github/scripts/wear-apk-0.6.18/step-20.sh
      - name: Upload Wear APK
        uses: actions/upload-artifact@v7
        with:
          name: Coolapk-WearOS-v0.6.18-Full-Features-ARMv7-GalaxyWatch7
          path: dist/
          if-no-files-found: error
