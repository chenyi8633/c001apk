# Coolapk Wear OS 0.6.19 / Galaxy Watch7 32-bit ARMv7 编译修复版
# 使用：将本文件放到 .github/workflows/wear-apk.yml 并提交到 main。
# 从 Fork 仓库当前提交构建，保留 :core 网络层；只修正 0.6.16 的 Kotlin 编译错误。

name: Build Coolapk Wear OS v0.6.19 - Compile Fix Round 2 + ARMv7
run-name: Wear OS 0.6.19 第二轮第二轮编译修复、社交功能保留、32 位 ARMv7

on:
