          import androidx.wear.compose.material3.AppScaffold
          import androidx.wear.compose.material3.MaterialTheme
          import androidx.wear.compose.navigation.SwipeDismissableNavHost
          import androidx.wear.compose.navigation.composable
          import androidx.wear.compose.navigation.rememberSwipeDismissableNavController
          import com.zailinn.c001apk.core.model.Datum

          /** Values that screens hand to the next one; kept out of route strings so any text is safe. */
          private class NavArgs {
              val feeds = HashMap<String, Datum>()
              val targets = HashMap<String, WearTarget>()
              var targetIndex: Int = 0
              var keyword: String = ""
              var images: List<String> = emptyList()
              var imageIndex: Int = 0
          }

          /** Resolve the same /t/<tag> and /product/<id> links used by the phone app. */
          private fun targetFrom(item: Datum): WearTarget? {
              val url = item.url.orEmpty()
              return when {
                  "/t/" in url -> url.substringAfter("/t/").substringBefore('?').substringBefore('#')
                      .takeIf { it.isNotBlank() }?.let { WearTarget(tag = Uri.decode(it)) }
                  "/product/" in url -> url.substringAfter("/product/").substringBefore('?').substringBefore('#').substringBefore('/')
                      .takeIf { it.isNotBlank() }?.let { WearTarget(id = Uri.decode(it)) }
                  item.entityType == "topic" -> item.title?.takeIf { it.isNotBlank() }?.let { WearTarget(tag = it) }
                  item.entityType == "product" -> (item.id ?: item.entityId)?.takeIf { it.isNotBlank() }?.let { WearTarget(id = it) }
                  else -> null
              }
          }

          @Composable
          fun WearApp(container: WearContainer) {
              MaterialTheme {
                  AppScaffold {
                      val navController = rememberSwipeDismissableNavController()
                      val args = remember { NavArgs() }

                      // Kept above the navigation host so going back does not reload or lose the scroll position.
                      val homeFeed = remember {
                          PagedFeed { page -> container.repository.homeFeed(page, 1, container.installTime) }
                      }
                      val homeList = rememberScalingLazyListState()
                      var results by remember { mutableStateOf<PagedFeed?>(null) }
                      val resultsList = rememberScalingLazyListState()

                      // A new account sees its own home feed.
                      LaunchedEffect(container.accountVersion) {
                          if (container.accountVersion > 0) homeFeed.reset()
                      }

                      fun openFeed(feed: Datum) {
                          val id = feed.id ?: feed.entityId ?: return
                          args.feeds[id] = feed
                          navController.navigate("feed/$id")
                      }

                      fun openImages(urls: List<String>, index: Int) {
                          args.images = urls
                          args.imageIndex = index
                          navController.navigate("images")
                      }

                      fun openTarget(item: Datum) {
                          val target = targetFrom(item) ?: return
                          val key = "target-${++args.targetIndex}"
                          args.targets[key] = target
                          navController.navigate("target/$key")
                      }

                      SwipeDismissableNavHost(navController = navController, startDestination = "home") {
                          composable("home") {
                              HomeScreen(
                                  container = container,
                                  feed = homeFeed,
                                  listState = homeList,
                                  onOpenFeed = ::openFeed,
                                  onOpenUser = { uid -> navController.navigate("user/$uid") },
                                  onOpenTarget = ::openTarget,
                                  onSearch = { navController.navigate("search") },
                                  onMe = { navController.navigate("me") },
                              )
                          }
                          composable("search") {
                              SearchScreen(container) { keyword ->
                                  container.addHistory(keyword)
                                  args.keyword = keyword
                                  results = PagedFeed { page ->
                                      container.repository.search("feed", "all", "default", keyword, 0, null, null, page)
                                  }
                                  navController.navigate("results")
                              }
                          }
                          composable("results") {
                              results?.let {
                                  ResultsScreen(
                                      keyword = args.keyword,
                                      feed = it,
                                      listState = resultsList,
                                      onOpenFeed = ::openFeed,
                                      onOpenUser = { uid -> navController.navigate("user/$uid") },
                                      onOpenTarget = ::openTarget,
                                  )
                              }
                          }
                          composable("feed/{id}") { entry ->
                              val id = entry.arguments?.getString("id").orEmpty()
                              args.feeds[id]?.let { initial ->
                                  DetailScreen(
                                      container = container,
                                      initial = initial,
                                      onUser = { uid -> navController.navigate("user/$uid") },
                                      onTarget = ::openTarget,
                                      onImages = ::openImages,
                                  )
                              }
                          }
                          composable("user/{uid}") { entry ->
                              val uid = entry.arguments?.getString("uid").orEmpty()
                              UserScreen(
                                  container = container,
                                  uid = uid,
                                  onOpenFeed = ::openFeed,
                                  onOpenUser = { userId -> if (userId != uid) navController.navigate("user/$userId") },
                                  onOpenTarget = ::openTarget,
                                  onImages = ::openImages,
                              )
                          }
                          composable("target/{key}") { entry ->
                              val key = entry.arguments?.getString("key").orEmpty()
                              args.targets[key]?.let { target ->
                                  TargetScreen(
                                      container = container,
                                      target = target,
                                      onOpenFeed = ::openFeed,
                                      onOpenUser = { uid -> navController.navigate("user/$uid") },
                                      onOpenTarget = ::openTarget,
                                  )
                              }
                          }
                          composable("me") {
                              MeScreen(
                                  container = container,
                                  onLogin = { navController.navigate("login") },
                                  onProfile = { uid -> navController.navigate("user/$uid") },
                                  onAbout = { navController.navigate("about") },
                              )
                          }
                          composable("login") {
                              LoginScreen(container) { navController.popBackStack() }
                          }
                          composable("images") {
                              ImageViewerScreen(args.images, args.imageIndex)
                          }
                          composable("about") {
                              AboutScreen()
                          }
                      }
                  }
              }
          }
