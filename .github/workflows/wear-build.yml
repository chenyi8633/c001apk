          cat > wear/src/main/kotlin/com/zailinn/c001apk/wear/WearContainer.kt <<'WEAR_EOF'
          package com.zailinn.c001apk.wear

          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import com.zailinn.c001apk.core.net.AccountCredentials
          import com.zailinn.c001apk.core.net.ApiFailure
          import com.zailinn.c001apk.core.net.CoolapkClient
          import com.zailinn.c001apk.core.net.CoolapkHeaders
          import com.zailinn.c001apk.core.net.CoolapkRepository
          import com.zailinn.c001apk.core.net.SessionState
          import com.zailinn.c001apk.core.net.readApiObject
          import com.zailinn.c001apk.core.protocol.ProtocolParams
          import kotlinx.coroutines.CancellationException
          import kotlinx.serialization.json.JsonObject
          import kotlinx.serialization.json.JsonPrimitive
          import okhttp3.OkHttpClient

          /** Everything the watch app shares: the phone app's network layer, a guest or Cookie account, and search history. */
          class WearContainer(context: Context) {
              private val prefs = context.getSharedPreferences("wear", Context.MODE_PRIVATE)
              private val protocol: ProtocolParams = loadProtocol()

              val installTime: String = prefs.getString("installTime", null)
                  ?: System.currentTimeMillis().toString().also { prefs.edit().putString("installTime", it).apply() }

              val session = SessionState()
              private val baseHttp = OkHttpClient()

              /** Images only get the client user agent, never API credentials. */
              val imageHttp: OkHttpClient = baseHttp.newBuilder()
                  .addInterceptor { chain ->
                      chain.proceed(chain.request().newBuilder().header("User-Agent", protocol.userAgent).build())
                  }
                  .build()

              val client = CoolapkClient(session, CoolapkHeaders(session, { protocol }), baseHttp)
              val repository = CoolapkRepository(client)

              /** The signed-in account, or null for guest mode. */
              var account by mutableStateOf<AccountCredentials?>(null)
                  private set

              /** Bumped on every login or logout, so account-bound lists reload. */
              var accountVersion by mutableIntStateOf(0)
                  private set

              var history by mutableStateOf(readHistory())
                  private set

              init {
                  val uid = prefs.getString("acc_uid", null)
                  val name = prefs.getString("acc_name", null)
                  val token = prefs.getString("acc_token", null)
                  if (uid != null && name != null && token != null) {
                      val saved = AccountCredentials(uid, name, token)
                      account = saved
                      session.activate(saved, notify = false)
                  }
              }

              /** Checks the pasted Cookie with the server first, like the phone app. Returns an error message, or null on success. */
              suspend fun loginWithCookie(text: String): String? {
                  val pasted = AccountCredentials.parseCookie(text) ?: return "Cookie 缺少有效的 uid、username 或 token"
                  try {
                      val data = readApiObject(repository.checkLoginInfo(pasted))["data"] as? JsonObject
                          ?: return "Cookie 无效或已过期"
                      val uid = (data["uid"] as? JsonPrimitive)?.content
                      if (uid != pasted.uid) return "Cookie 无效或已过期"
                      // The server may hand out a refreshed token.
                      val token = (data["token"] as? JsonPrimitive)?.content?.takeIf { it.isNotEmpty() } ?: pasted.token
                      val saved = pasted.copy(token = token)
                      prefs.edit()
                          .putString("acc_uid", saved.uid)
                          .putString("acc_name", saved.username)
                          .putString("acc_token", saved.token)
                          .apply()
                      session.activate(saved, notify = true)
                      account = saved
                      accountVersion++
                      return null
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      return ApiFailure.from(e).message
                  }
              }

              fun logout() {
                  prefs.edit().remove("acc_uid").remove("acc_name").remove("acc_token").apply()
                  session.activate(null, notify = true)
                  account = null
                  accountVersion++
              }

              fun addHistory(keyword: String) {
                  val clean = keyword.trim()
                  if (clean.isEmpty()) return
                  history = (listOf(clean) + history.filter { it != clean }).take(6)
                  prefs.edit().putString("history", history.joinToString("\n")).apply()
              }

              fun clearHistory() {
                  history = emptyList()
                  prefs.edit().remove("history").apply()
              }

              private fun readHistory(): List<String> =
                  prefs.getString("history", null)?.split("\n")?.filter { it.isNotBlank() }.orEmpty()

              private fun loadProtocol(): ProtocolParams {
                  val device = prefs.getString("xAppDevice", null)
                  if (device != null) {
                      return ProtocolParams(
                          manufacturer = prefs.getString("manufacturer", "").orEmpty(),
                          brand = prefs.getString("brand", "").orEmpty(),
                          model = prefs.getString("model", "").orEmpty(),
                          buildNumber = prefs.getString("buildNumber", "").orEmpty(),
                          sdkInt = prefs.getString("sdkInt", "").orEmpty(),
                          androidVersion = prefs.getString("androidVersion", "").orEmpty(),
                          userAgent = prefs.getString("userAgent", "").orEmpty(),
                          xAppDevice = device,
                      )
                  }
                  val fresh = ProtocolParams.generate()
                  prefs.edit()
                      .putString("manufacturer", fresh.manufacturer)
                      .putString("brand", fresh.brand)
                      .putString("model", fresh.model)
                      .putString("buildNumber", fresh.buildNumber)
                      .putString("sdkInt", fresh.sdkInt)
                      .putString("androidVersion", fresh.androidVersion)
                      .putString("userAgent", fresh.userAgent)
                      .putString("xAppDevice", fresh.xAppDevice)
                      .apply()
                  return fresh
              }
          }
