          sed -i 's/include(":core", ":app")/include(":core", ":app", ":wear")/' settings.gradle.kts
          grep -n include settings.gradle.kts

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Wear debug APK
        run: |
          set -o pipefail
          ./gradlew :wear:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo '### 编译出错了，把下面这段文字或截图发给 Claude'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed' -A3 build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Faster, smaller build. If it fails, the debug APK above is still delivered.
      - name: Build Wear optimized APK
        continue-on-error: true
        run: ./gradlew :wear:assembleRelease --stacktrace --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wear-apk
          path: wear/build/outputs/apk/**/*.apk
          if-no-files-found: error
