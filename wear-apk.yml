name: Build Wear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack Wear module
        run: |
          if [ ! -f wear-src.zip ]; then
            echo "wear-src.zip not found in the repository root"
            exit 1
          fi
          rm -rf wear
          unzip -q wear-src.zip
          sed -i 's/include(":core", ":app")/include(":core", ":app", ":wear")/' settings.gradle.kts
          grep -n include settings.gradle.kts

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Wear debug APK
        run: ./gradlew :wear:assembleDebug --stacktrace --console=plain

      # Faster, smaller build. If it fails, the debug APK above is still delivered.
      - name: Build Wear optimized APK
        continue-on-error: true
        run: ./gradlew :wear:assembleRelease --stacktrace --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wear-apk
          path: wear/build/outputs/apk/**/*.apk
          if-no-files-found: error
